<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외주가공 발주</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.panes{display:grid;grid-template-columns:1.1fr .62fr 1.7fr;gap:6px;padding:7px 14px 0;height:190px}
.box{border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}.box-title{height:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.searchbar{height:26px;display:flex;gap:4px;align-items:center;padding:0 4px;border-bottom:1px solid var(--line2);background:#f6f8fa}.searchbar input{flex:1;height:21px;border:1px solid #b7c2cb;padding:0 4px;min-width:0}.searchbar button{height:21px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#e2e8ed)}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{height:24px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
td.route{text-align:center;font-weight:400;color:#8b98a3;background:#fff;white-space:nowrap}
td.route .st{display:block;font-size:10px;line-height:13px;border-radius:7px;margin-top:1px;padding:0 4px}
/* v112: 공용 얼룩무늬 배경(!important)이 상태색을 덮지 않도록 이 셀들도 !important 로 고정 */
td.route{background:#fff!important}
td.route.s-next{background:#8fdc6b!important;color:#20461a;font-weight:700;cursor:pointer}
td.route.s-next .st{background:#2e7d32;color:#fff}
td.route.s-ext{background:#dff5d3!important;color:#2c5a24;cursor:pointer}
td.route.s-pick{background:#5cb85c!important;color:#fff;font-weight:700;cursor:pointer}
td.route.s-req{background:#efe5f7!important;color:#5a3a7a}td.route.s-req .st{background:#8e6bb0;color:#fff}
td.route.s-out{background:#ffe9d1!important;color:#7a4a12;font-weight:700}td.route.s-out .st{background:#e07a1f;color:#fff}
/* v112: 공정 셀 우클릭 팝업 — 발주/입고/입고확정을 그 자리에서 처리 */
#ctxMask{position:fixed;inset:0;z-index:9000;display:none}#ctxMask.on{display:block}
#ctxPop{position:fixed;z-index:9001;width:400px;max-width:96vw;background:#fff;border:1px solid #6f8090;box-shadow:0 8px 26px rgba(0,0,0,.28);display:none;font-size:12px;color:#22303a}
#ctxPop.on{display:block}
#ctxPop .ch{display:flex;align-items:center;gap:8px;padding:0 8px 0 11px;height:31px;color:#fff;font-weight:700;background:linear-gradient(#5f7f9f,#3f5f7d)}
#ctxPop .ch.k-order{background:linear-gradient(#5e9e46,#3f7a2c)}#ctxPop .ch.k-in{background:linear-gradient(#e08a2b,#b8681a)}#ctxPop .ch.k-cfm{background:linear-gradient(#3f7fc4,#2a5d95)}
#ctxPop .ch .x{margin-left:auto;border:0;background:transparent;color:#fff;cursor:pointer;font:inherit;font-size:14px}
#ctxPop .cb{padding:9px 11px 6px}
#ctxPop .sub{color:#4d5c69;margin-bottom:7px;line-height:1.5}
#ctxPop .sub b{color:#20456b}
#ctxPop .g{display:grid;grid-template-columns:76px minmax(0,1fr) 76px minmax(0,1fr);gap:5px 7px;align-items:center}
#ctxPop .g label{font-weight:700;text-align:right;color:#4d5c69;white-space:nowrap}
#ctxPop .g input,#ctxPop .g select{width:100%;min-width:0;height:25px;border:1px solid #b9c3cb;padding:0 5px;font:inherit;box-sizing:border-box;color:#22303a;background:#fff}
#ctxPop .g input.r{text-align:right}
#ctxPop .g .full{grid-column:2/5}
#ctxPop .g .chk{grid-column:2/5;font-weight:400;text-align:left;display:flex;align-items:center;gap:5px}
#ctxPop .note{font-size:11px;color:#6d7b88;margin-top:6px;line-height:1.45}
#ctxPop .cf{display:flex;gap:6px;justify-content:flex-end;padding:8px 11px 10px;border-top:1px solid #e3e9ed;background:#f7f9fa}
#ctxPop .cf .btn{height:27px;min-width:72px}
#ctxPop .cf .btn.go{font-weight:700;color:#fff;border-color:#2a5d95;background:linear-gradient(#4a8ad0,#2f6fb0)}
#ctxPop .cf .btn.go.k-order{border-color:#3f7a2c;background:linear-gradient(#5e9e46,#3f7a2c)}
#ctxPop .cf .btn.go.k-in{border-color:#b8681a;background:linear-gradient(#e08a2b,#b8681a)}
#ctxPop .cf .btn.go:disabled{opacity:.5}
#ctxPop .info{display:grid;grid-template-columns:76px 1fr;gap:3px 8px}#ctxPop .info b{color:#4d5c69;text-align:right}
td.route.s-in{background:#dbeaf8!important;color:#1a4f7a;font-weight:700}td.route.s-in .st{background:#2f6fb5;color:#fff}
td.route.s-done{background:#e6e9ec!important;color:#7d8993}td.route.s-done .st{background:#8b98a3;color:#fff}
.legend{font-size:11px;color:#5a6b7a;margin-left:8px;font-weight:400}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
tr.rdone{background:#f4f6f8;color:#8b98a3}
tr.rdone td{color:#8b98a3}
.tagd{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid #b7c2cb;border-radius:8px;background:#fff;font-size:11px;color:#5a6b7a;font-weight:400}
.reqbox tbody tr td{background:#9ade79}
.midbar{display:flex;align-items:center;gap:6px;padding:6px 14px;justify-content:flex-end}
.reqbox{flex:1;min-height:0;margin:0 14px 6px;border:1px solid var(--line);display:flex;flex-direction:column}.reqbox table{min-width:1280px}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.panes{grid-template-columns:1fr;height:auto}.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>외주가공 발주</h1></div>
  <section class="filters">
    <span class="label">제번</span><input id="jobQ" class="field" style="width:190px">
    <span class="label">품명</span><input id="itemQ" class="field" style="width:190px">
    <span class="label">업체</span><input id="venF" class="field" style="width:190px">
    <button class="btn" onclick="search()">⌕ 조회</button>
    <button class="btn" id="btnRefresh" onclick="refreshAll()" title="DB에서 제번·부품별 가공공정을 다시 불러옵니다 (다른 화면의 발주·입고 반영)">⟳ 새로고침</button>
  </section>
  <section class="panes">
    <div class="box"><div class="box-title">제번리스트</div><div class="tablewrap"><table>
      <colgroup><col style="width:34%"><col style="width:34%"><col style="width:16%"><col style="width:16%"></colgroup>
      <thead><tr><th>제번</th><th>품명</th><th>공정</th><th>공정명</th></tr></thead><tbody id="jobBody"></tbody></table></div></div>
    <div class="box"><div class="box-title">협력업체리스트</div>
      <div class="searchbar"><input id="venQ" placeholder="Enter text to s"><button onclick="findVendor()">찾기</button><button onclick="clearVendor()">지우기</button></div>
      <div class="tablewrap"><table><thead><tr><th>협력업체</th></tr></thead><tbody id="venBody"></tbody></table></div></div>
    <div class="box"><div class="box-title">부품별 가공공정 리스트<span class="legend"><i style="background:#8fdc6b"></i>다음 공정(클릭)<i style="background:#8e6bb0"></i>요청<i style="background:#e07a1f"></i>출고<i style="background:#2f6fb5"></i>입고<i style="background:#8b98a3"></i>완료</span></div><div class="tablewrap"><table style="min-width:900px">
      <colgroup><col style="width:36px"><col style="width:80px"><col style="width:90px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"><col style="width:56px"></colgroup>
      <thead><tr><th></th><th style="width:46px">조</th><th>부품코드</th><th>부품명</th><th>공정1</th><th>공정2</th><th>공정3</th><th>공정4</th><th>공정5</th><th>공정6</th><th>공정7</th><th>공정8</th><th>공정9</th></tr></thead>
      <tbody id="routeBody"></tbody></table></div></div>
  </section>
  <div class="midbar"><span class="label">입고요구일</span><input id="reqDate" class="field" type="date"><button class="btn" onclick="pushDown()">⬇ 요청추가</button><button class="btn" onclick="pullUp()">⬆ 요청삭제</button></div>
  <div class="reqbox"><div class="box-title">구매요청 리스트</div><div class="tablewrap"><table>
    <colgroup><col style="width:40px"><col style="width:38px"><col style="width:110px"><col style="width:110px"><col style="width:120px"><col style="width:50px"><col style="width:60px"><col style="width:70px"><col style="width:150px"><col style="width:100px"><col style="width:120px"><col style="width:64px"><col style="width:92px"><col style="width:100px"><col style="width:90px"><col style="width:80px"></colgroup>
    <thead><tr><th>No</th><th>선택</th><th>협력업체</th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th>순번</th><th>가공공정코드</th><th>가공공정</th><th>수량</th><th>발주월</th><th>입고요구월</th><th>비고</th><th>작성자</th></tr></thead>
    <tbody id="reqBody"></tbody>
  </table></div></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn primary" onclick="save()">▣ 저장</button><button class="btn" onclick="sampleFill()" title="화면 순서대로 시연하며 등록요점을 설명합니다.">▶ 등록예제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫 기</button><span class="msg" id="message">제번·협력업체를 고르고 가공공정을 내려 외주가공 발주를 등록합니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
/* v46: 작성자/담당자 기본값 = 로그인 사용자 (회사명 하드코딩 제거) */
const OWNER=(function(){try{return (window.MES_AUTH||window.parent.MES_AUTH)?.name||'담당자'}catch(e){return '담당자'}})();

const JOBS=[];
let VENDORS=[];  /* 협력업체는 마스터에서 로드 (mes_lookup.js) */
const PROCNAME={};   /* v39: 공정마스터에서 로드 */
/* v86: 부품별 가공공정 리스트를 공정코드 대신 공정명으로 표기 */
const _esc=v=>String(v??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const stepCode=s=>String((s&&typeof s==='object')?(s.process_code||s.code||''):(s??'')).trim();
/* v90: 조(공정)는 숫자로 통일 — 옛 A/B/C 코드가 남아 있으면 1/2/3 으로 환산한다 */
const joNum=v=>{try{return window.MESJO?MESJO.norm(v):String(v??'').trim()}catch(e){return String(v??'').trim()}};
const joName=(jo,q)=>String(jo||'')+'/'+Math.max(1,Number(q)||1);
const procName=c=>{const k=stepCode(c);if(!k)return'';return PROCNAME[k]||PROCNAME[k.toUpperCase()]||k};
/* v97: 공정 순차 진행 — 부품의 가공공정은 공정1→2→3… 순서로 서로 다른 외주처에 발주한다.
 *  상태(업체 무관, 부품+공정순번 기준): '' 미발주 · 요청(구매요청 리스트) · 출고(발주됨=외주처 반출) · 입고 · 완료(입고확정)
 *  다음 공정은 직전 공정이 입고/완료일 때만 발주할 수 있다. 같은 업체가 연속 공정을 할 때는 셀을 눌러 범위를 넓힌다. */
const ORDERED=new Map();                                   /* '품번|순번' → {st,vendor}  (순번 없는 옛 라인은 '품번|공정코드') */
const okey=(pt,k)=>[pt||'',k||''].join('|');
const ST_DB={'발주':'출고','입고':'입고','입고확정':'완료'};
async function loadOrdered(job){
 ORDERED.clear();
 if(!job||!(window.MESDB&&MESDB.online))return;
 try{
  const ex=await MESDB.table('order_lines')
    .select(`select=line_id,part_no,vendor_name,machining_process_code,step_no,status,order_qty,receipt_qty,unit_price,quote_price,confirm_price,nego_rate,order_date,required_date,receipt_date,confirm_date,remark&category=eq.${encodeURIComponent('외주가공')}&job_no=eq.${encodeURIComponent(job)}&order=line_id`,{fresh:true});
  (ex||[]).forEach(e=>{const st=ST_DB[String(e.status||'')];if(!st)return;
   const k=e.step_no?okey(e.part_no,'#'+e.step_no):okey(e.part_no,e.machining_process_code);
   ORDERED.set(k,{st,vendor:e.vendor_name||'',line:e})});   /* 같은 키가 여럿이면 최신 line_id 가 남는다. v112: line 원본은 우클릭 팝업용 */
 }catch(e){}
}
const curVendor=()=>venView[venIdx]||'';
/* 부품 r 의 i번째(0-based) 공정 상태 */
function stepInfo(r,i){
 const c=stepCode((r.steps||[])[i]);if(!c)return {st:'',vendor:''};
 let o=ORDERED.get(okey(r.part,'#'+(i+1)));
 if(!o){o=ORDERED.get(okey(r.part,c));if(o&&(r.steps||[]).findIndex(s=>stepCode(s)===c)!==i)o=null}  /* 옛 라인(순번 없음)은 첫 동일코드 공정에만 */
 if(o)return o;
 const q=REQ.find(x=>x.part===r.part&&x.sn===i+1);
 return q?{st:'요청',vendor:q.vendor}:{st:'',vendor:''};
}
const stepState=(r,i)=>stepInfo(r,i).st;
/* v112: 현품이 들어오면(입고) 다음 공정을 발주할 수 있다. 입고확정(전표)은 뒤늦게 처리될 수 있으므로 진행을 막지 않는다. */
const RECV=st=>st==='입고'||st==='완료';
/* 다음 발주 가능 공정 index (없으면 -1). 직전 공정이 출고/요청이면 대기(-2) */
function nextStep(r){
 const n=(r.steps||[]).map(stepCode).filter(Boolean).length;
 for(let i=0;i<n;i++){const st=stepState(r,i);
  if(st==='')return (i===0||RECV(stepState(r,i-1)))?i:-2;
 }
 return -1;
}
/* 선택: 부품 index → 다음 공정부터 몇 개 (연속 공정을 같은 업체에 줄 때 확장) */
const PICK=new Map();
function pickSteps(r){const nx=nextStep(r);if(nx<0)return [];const n=(r.steps||[]).map(stepCode).filter(Boolean).length;
 let cnt=Math.max(1,PICK.get(ROUTES.indexOf(r))||1),out=[];
 for(let i=nx;i<n&&out.length<cnt;i++){if(stepState(r,i)!=='')break;out.push(i)}return out}
function pickCell(ri,i){const r=ROUTES[ri];if(!r)return;const nx=nextStep(r);if(nx<0||i<nx)return;
 for(let k=nx;k<=i;k++)if(stepState(r,k)!=='')return;
 const cur=PICK.get(ri)||0, want=i-nx+1;
 if(cur===want&&want===1){PICK.delete(ri)}else PICK.set(ri,want);
 renderRoutes();
 const cnt=PICK.get(ri)||0;
 msg(cnt?`${r.part}: 공정${nx+1}${cnt>1?'~'+(nx+cnt):''} (${pickSteps(r).map(k=>procName(r.steps[k])).join(' → ')}) 를 ${curVendor()||'선택 업체'}에 발주 요청 준비`:`${r.part} 선택 해제`)}
function pickRow(ri,on){if(on){if(!PICK.has(ri))PICK.set(ri,1)}else PICK.delete(ri);renderRoutes()}
const ROUTES=[];     /* v39: 선택 제번의 가공공정(machining_plan_parts / PartList)에서 로드 */
const REQ=[];
let jobIdx=0,venIdx=6,jobView=[...JOBS],venView=[...VENDORS];
function renderJobs(){jobBody.innerHTML=jobView.map((j,i)=>`<tr class="${i===jobIdx?'sel':''}" onclick="pickJob(${i})"><td>${j.job}</td><td>${j.item}</td><td class="c">${j.proc}</td><td class="c">${j.procName}</td></tr>`).join('');countText.textContent=`제번 ${jobView.length}건 / 요청 ${REQ.length}건`}
function renderVendors(){venBody.innerHTML=venView.map((v,i)=>`<tr class="${i===venIdx?'sel':''}" onclick="pickVendor(${i})"><td>${v}</td></tr>`).join('')}
function renderRoutes(){
 routeBody.innerHTML=ROUTES.map((r,ri)=>{
  const codes=(r.steps||[]).map(stepCode).filter(Boolean), n=codes.length;
  const nx=nextStep(r), picks=PICK.has(ri)?pickSteps(r):[];
  const done=codes.filter((c,i)=>stepState(r,i)==='완료').length;
  const allDone=n>0&&nx===-1&&codes.every((c,i)=>RECV(stepState(r,i)));
  const wait=nx===-2;
  const dis=n===0||nx<0;
  /* v112: 입고는 됐지만 입고확정(전표)이 안 끝난 공정 수 — 진행은 막지 않고 표시만 한다 */
  const unfix=codes.filter((c,i)=>stepState(r,i)==='입고').length;
  const fixTag=unfix?`<span class="tagd" style="background:#dbeaf8;color:#1a4f7a" title="현품은 입고됐지만 입고확정(전표)이 남아 있습니다. 셀을 우클릭해 확정하세요.">확정대기 ${unfix}</span>`:'';
  const tag=(n===0?'':allDone?'<span class="tagd">전공정 완료</span>':wait?`<span class="tagd">공정${codes.findIndex((c,i)=>stepState(r,i)==='')} ${stepState(r,codes.findIndex((c,i)=>stepState(r,i)==='')-1)} 대기</span>`:nx>0?`<span class="tagd">${nx}/${n} 진행</span>`:'')+fixTag;
  const tip=allDone?'모든 가공공정이 입고되었습니다':wait?'직전 공정이 아직 입고되지 않아 다음 공정을 발주할 수 없습니다 (직전 공정 셀 우클릭 → 입고 처리)':'';

 if(st==='입고')return ctxConfirm(ev,head);
 if(st==='완료')return ctxDone(ev,head);
 return false;
}
function ctxInfo(ev,title,html){ctxOpen(ev,title,'',html);return false}

/* ── 발주 ── */
async function ctxOrder(ev,head){
 const {r,i,c,job}=CTX;
 const vopts=VENDORS.map(v=>`<option value="${_esc(v)}"${v===curVendor()?' selected':''}>${_esc(v)}</option>`).join('');
 const today=T0(),rd=reqDate.value||new Date(Date.now()+12*864e5).toISOString().slice(0,10);
 ctxOpen(ev,`공정${i+1} ${procName(c)} — 발주`,'k-order',head+`
  <div class="g">
   <label>협력업체</label><select id="cxVendor" class="full" onchange="ctxPrice()"><option value="">(업체 선택)</option>${vopts}</select>
   <label>수량</label><input id="cxQty" class="r" value="1" inputmode="numeric" onchange="ctxAmt()">
   <label>발주일</label><input id="cxOdate" type="date" value="${today}" onchange="ctxPrice()">
   <label>입고요구일</label><input id="cxRdate" type="date" value="${rd}">
   <label>단가</label><input id="cxPrice" class="r" value="0" inputmode="numeric" onchange="ctxAmt()">
   <label>발주금액</label><input id="cxAmt" class="r" value="0" readonly>
   <label>비고</label><input id="cxRemark" class="full" placeholder="선택">
  </div>
  <div class="note" id="cxNote">단가는 공정단가변동등록에서 업체·발주일 기준으로 자동 조회됩니다. 없으면 직접 입력하세요.</div>`,
  `<button class="btn" onclick="ctxAddReq()" title="바로 등록하지 않고 아래 구매요청 리스트에 넣습니다">↓ 요청 리스트</button>
   <button class="btn go k-order" id="cxGo" onclick="ctxOrderNow()">▣ 즉시 발주</button>
   <button class="btn" onclick="ctxClose()">취소</button>`);
 await ctxPrice();
 return false;
}
async function ctxPrice(){
 const {c}=CTX||{};if(!c)return;
 const v=_v('cxVendor'),d=_v('cxOdate')||T0();
 if(!v||!window.MESPRICE)return ctxAmt();
 try{const hit=await MESPRICE.process(c,v,{asOf:d});
  const p=document.getElementById('cxPrice');if(p&&hit&&hit.price)p.value=hit.price;
  const n=document.getElementById('cxNote');if(n)n.textContent=hit&&hit.price?`단가 ${_won(hit.price)}원 (${v} · ${d} 기준 자동조회)`:'등록된 단가가 없습니다 — 직접 입력하면 발주금액에 반영됩니다.';
 }catch(e){}
 ctxAmt();
}
function ctxAmt(){const a=document.getElementById('cxAmt');if(a)a.value=_won(_n(_v('cxPrice'))*Math.max(1,_n(_v('cxQty'))))}
function ctxRow(){
 const {r,i,c,job}=CTX;
 const n=(r.steps||[]).map(stepCode).filter(Boolean).length;
 const qty=Math.max(1,Math.round(_n(_v('cxQty')))),price=_n(_v('cxPrice'));
 return {no:REQ.length?Math.max(...REQ.map(x=>x.no))+1:1,vendor:_v('cxVendor'),job:job.job,item:job.item,
  proc:(r.jo||job.proc||'1'),procName:joName(r.jo||job.proc||'1',job.setQty||1),part:r.part,partName:r.name,sn:i+1,snOf:n,
  mp:c,mpName:procName(c),qty,odate:_v('cxOdate')||T0(),rdate:_v('cxRdate')||'',remark:_v('cxRemark')||'',writer:OWNER,price,amount:price*qty};
}
function ctxAddReq(){
 const row=ctxRow();if(!row.vendor)return msg('협력업체를 선택하세요.');
 if(REQ.some(x=>x.part===row.part&&x.sn===row.sn))return msg(`${row.part} 공정${row.sn} 은 이미 요청 리스트에 있습니다.`);
 REQ.push(row);renderReq();renderRoutes();ctxClose();
 msg(`${row.part} 공정${row.sn} ${row.mpName} → ${row.vendor} 요청 리스트에 추가 (${_won(row.amount)}원). [저장]으로 발주하세요.`);
}
async function ctxOrderNow(){
 const row=ctxRow();if(!row.vendor)return msg('협력업체를 선택하세요.');
 if(!_online())return msg('DB 미연결 - 즉시 발주는 사용할 수 없습니다. 요청 리스트로 넣어두세요.');
 const b=document.getElementById('cxGo');if(b){b.disabled=true;b.textContent='등록 중…'}
 try{
  const bad=await dupCheck('외주가공',row.job,[row]);
  if(bad.length){msg('발주할 수 없습니다: '+bad.join(', '));if(b){b.disabled=false;b.textContent='▣ 즉시 발주'}return}
  await MESDB.newLines([{category:'외주가공',status:'발주',vendor_name:row.vendor,job_no:row.job,item_name:row.item||null,process_code:row.proc,process_name:row.procName,part_no:row.part,part_name:row.partName,machining_process_code:row.mp,machining_process_name:row.mpName||null,step_no:Number(row.sn)||null,order_qty:row.qty,unit_price:row.price||null,quote_price:row.amount||null,order_date:row.odate||null,required_date:row.rdate||null,owner_name:row.writer||null,remark:row.remark||null}]);
  await ctxAfter(row.job,`${row.part} 공정${row.sn} ${row.mpName} → ${row.vendor} 발주 등록 (${_won(row.amount)}원, 입고요구 ${row.rdate||'-'}). 공정 리스트에 출고 표시.`);
 }catch(e){msg('발주 실패: '+String(e.message||e).slice(0,120));if(b){b.disabled=false;b.textContent='▣ 즉시 발주'}}
}

/* ── 요청 리스트에 있는 공정 ── */
function ctxReq(ev,head){
 const {r,i}=CTX;const q=REQ.find(x=>x.part===r.part&&x.sn===i+1);
 ctxOpen(ev,`공정${i+1} — 요청 리스트`,'',head+`<div class="info"><b>업체</b><span>${_esc(q?q.vendor:'')}</span><b>수량</b><span>${q?q.qty:''}</span><b>입고요구일</b><span>${_esc(q?q.rdate:'')}</span><b>발주금액</b><span>${q?_won(q.amount):''}원</span></div>
  <div class="note">아래 구매요청 리스트에 담겨 있습니다. [저장]을 누르면 발주됩니다.</div>`,
  `<button class="btn" onclick="ctxReqDel()">✕ 요청에서 삭제</button><button class="btn" onclick="ctxClose()">닫기</button>`);
 return false;
}
function ctxReqDel(){const {r,i}=CTX;const k=REQ.findIndex(x=>x.part===r.part&&x.sn===i+1);if(k>=0)REQ.splice(k,1);renderReq();renderRoutes();ctxClose();msg(`${r.part} 공정${i+1} 요청을 삭제했습니다.`)}

/* ── 입고 (fn_osp_receive) ── */
async function ospRpc(fn,body){
 const auth=(()=>{try{return window.parent.MES_AUTH||window.MES_AUTH||{}}catch(e){return window.MES_AUTH||{}}})();
 const res=await fetch(MESDB.cfg.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:MESDB.cfg.key,Authorization:'Bearer '+(auth.token||MESDB.cfg.key),'Content-Type':'application/json'},body:JSON.stringify(body)});
 const t=await res.text();if(!res.ok)throw new Error(t.slice(0,160));try{return JSON.parse(t)}catch(e){return null}
}
function ctxReceive(ev,head){
 const {i,c,o}=CTX;const l=o.line||{};
 const ord=_n(l.order_qty)||1,got=_n(l.receipt_qty),rem=Math.max(ord-got,0);
 ctxOpen(ev,`공정${i+1} ${procName(c)} — 입고`,'k-in',head+`
  <div class="info" style="margin-bottom:8px"><b>발주일</b><span>${_esc(String(l.order_date||'').slice(0,10))}</span><b>입고요구일</b><span>${_esc(String(l.required_date||'').slice(0,10))}</span><b>발주/기입고</b><span>${ord} / ${got} (잔량 ${rem})</span><b>발주금액</b><span>${_won(l.quote_price)}원</span></div>
  <div class="g">
   <label>입고수량</label><input id="cxInQty" class="r" value="${rem}" inputmode="numeric">
   <label>입고일</label><input id="cxInDate" type="date" value="${T0()}">
   <label></label><label class="chk"><input type="checkbox" id="cxShort" style="width:auto;height:auto"> 잔량은 입고하지 않음 (부족분 마감)</label>
   <label>비고</label><input id="cxInRemark" class="full" placeholder="선택">
  </div>`,
  `<button class="btn go k-in" id="cxGo" onclick="ctxReceiveNow()">▣ 입고 처리</button><button class="btn" onclick="ctxClose()">취소</button>`);
 return false;
}
async function ctxReceiveNow(){
 const {r,i,c,o,job}=CTX;const l=o.line||{};
 if(!l.line_id)return msg('발주 라인을 찾을 수 없습니다. [새로고침] 후 다시 시도하세요.');
 if(!_online())return msg('DB 미연결 - 입고 처리를 할 수 없습니다.');
 const ord=_n(l.order_qty)||1,got=_n(l.receipt_qty),rem=Math.max(ord-got,0),q=_n(_v('cxInQty'));
 if(!(q>0))return msg('입고수량을 입력하세요.');
 if(q>rem)return msg(`잔량 ${rem}을 초과했습니다.`);
 const rest=Math.max(rem-q,0),short=document.getElementById('cxShort').checked&&rest>0?rest:0;
 const b=document.getElementById('cxGo');if(b){b.disabled=true;b.textContent='처리 중…'}
 try{
  await ospRpc('fn_osp_receive',{p_line_id:Number(l.line_id),p_qty:q,p_date:_v('cxInDate')||T0(),p_short:short,p_source:'발주화면',p_remark:_v('cxInRemark')||null});
  await ctxAfter(job.job,`${r.part} 공정${i+1} ${procName(c)} 입고 ${q}개${rest&&!short?` (잔량 ${rest} 대기)`:''} — 다음 공정을 바로 발주할 수 있습니다. 입고확정(전표)은 이 셀을 다시 우클릭해 나중에 처리하세요.`);
 }catch(e){msg('입고 실패: '+String(e.message||e).slice(0,120));if(b){b.disabled=false;b.textContent='▣ 입고 처리'}}
}

/* ── 입고확정 ── */
function ctxConfirm(ev,head){
 const {i,c,o}=CTX;const l=o.line||{};
 const quote=_n(l.quote_price),fix=_n(l.confirm_price)||quote;
 ctxOpen(ev,`공정${i+1} ${procName(c)} — 입고확정`,'k-cfm',head+`
  <div class="info" style="margin-bottom:8px"><b>입고일</b><span>${_esc(String(l.receipt_date||'').slice(0,10))}</span><b>입고수량</b><span>${_n(l.receipt_qty)||_n(l.order_qty)||1}</span></div>
  <div class="g">
   <label>확정일</label><input id="cxCdate" type="date" value="${T0()}">
   <label>견적가</label><input id="cxQuote" class="r" value="${_won(quote)}" readonly>
   <label>네고율(%)</label><input id="cxRate" class="r" value="${quote?((1-fix/quote)*100).toFixed(1):'0'}" inputmode="decimal" onchange="ctxFixFromRate()">
   <label>확정가</label><input id="cxFix" class="r" value="${_won(fix)}" inputmode="numeric" onchange="ctxRateFromFix()">
  </div>
  <div class="note">확정가는 제조원가(외주가공비)에 반영됩니다. 네고율을 입력하면 확정가가, 확정가를 고치면 네고율이 맞춰집니다.</div>`,
  `<button class="btn go" id="cxGo" onclick="ctxConfirmNow()">▣ 입고확정</button><button class="btn" onclick="ctxClose()">취소</button>`);
 return false;
}
function ctxFixFromRate(){const q=_n(_v('cxQuote')),rt=_n(_v('cxRate'));document.getElementById('cxFix').value=_won(Math.round(q*(1-rt/100)))}
function ctxRateFromFix(){const q=_n(_v('cxQuote')),f=_n(_v('cxFix'));document.getElementById('cxRate').value=q?((1-f/q)*100).toFixed(1):'0'}
async function ctxConfirmNow(){
 const {r,i,c,o,job}=CTX;const l=o.line||{};
 if(!l.line_id)return msg('발주 라인을 찾을 수 없습니다. [새로고침] 후 다시 시도하세요.');
 if(!_online())return msg('DB 미연결 - 입고확정을 할 수 없습니다.');
 const fix=_n(_v('cxFix')),quote=_n(l.quote_price);
 const b=document.getElementById('cxGo');if(b){b.disabled=true;b.textContent='처리 중…'}
 try{
  await MESDB.table('order_lines').upsert([{line_id:Number(l.line_id),status:'입고확정',confirm_date:_v('cxCdate')||T0(),confirm_price:fix||null,nego_rate:quote?Number(((1-fix/quote)*100).toFixed(2)):null,updated_at:new Date().toISOString()}],'line_id');
  await ctxAfter(job.job,`${r.part} 공정${i+1} ${procName(c)} 입고확정 (확정가 ${_won(fix)}원) — 제조원가에 반영됩니다.`);
 }catch(e){msg('입고확정 실패: '+String(e.message||e).slice(0,120));if(b){b.disabled=false;b.textContent='▣ 입고확정'}}
}

/* ── 완료 내역 ── */
function ctxDone(ev,head){
 const {i,c,o}=CTX;const l=o.line||{};
 ctxOpen(ev,`공정${i+1} ${procName(c)} — 완료`,'',head+`<div class="info"><b>업체</b><span>${_esc(l.vendor_name||o.vendor||'')}</span><b>발주일</b><span>${_esc(String(l.order_date||'').slice(0,10))}</span><b>입고일</b><span>${_esc(String(l.receipt_date||'').slice(0,10))}</span><b>확정일</b><span>${_esc(String(l.confirm_date||'').slice(0,10))}</span><b>견적가</b><span>${_won(l.quote_price)}원</span><b>확정가</b><span>${_won(l.confirm_price)}원</span></div>
  <div class="note">입고취소가 필요하면 외주가공 입고확정 화면에서 처리하세요.</div>`);
 return false;
}

/* 처리 후 공통: 캐시 비우고 → 알림 → 공정 리스트 재조회 */
async function ctxAfter(job,text){
 try{MESDB.dropCache&&MESDB.dropCache('order_lines')}catch(e){}
 try{MESDB.notify&&MESDB.notify(['order_lines'])}catch(e){}
 ctxClose();
 await loadOrdered(job);renderRoutes();PICK.clear();
 msg(text);
 try{window.MESPOP&&MESPOP.ok(text,'처리 완료')}catch(e){}
}
window.MES={search,save,exportCsv,setMessage:msg,reload:refreshAll};
/* 다른 화면에서 발주·입고가 저장되면 자동으로 다시 읽는다 */
(function(){let t=null;const go=()=>{clearTimeout(t);t=setTimeout(refreshAll,500)};
 const bind=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(['order_lines','machining_plan_parts','partlist_materials'],go);return true}return false};
 if(!bind()){let n=0;const iv=setInterval(()=>{if(bind()||++n>40)clearInterval(iv)},100)}})();
</script>
