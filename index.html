let activeModule='', activeSecondary='', activeId='';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildModules(){modules.innerHTML=MODULES.filter(m=>{if(m==='사용메뉴얼')return true;const a=window.MES_AUTH;if(!a||!a.session||a.role==='admin'||a.role==='master')return true;
  return Object.entries(APP[m]?.menus||{}).some(([sec,gs])=>gs.some(g=>g.items.some(n=>a.can(m+'/'+sec+'/'+n,'view'))));
}).map(m=>`<button class="module ${m===activeModule?'on':''}" onclick="setModule('${m}')">${m}</button>`).join('')}
function buildSecondary(){
  const list=APP[activeModule]?.secondary||[];
  secondaryNav.innerHTML=list.map(x=>`<button class="tool ${x.name===activeSecondary?'on':''}" onclick="setSecondary('${x.name}')"><span class="ico">${x.icon}</span><span>${x.name}</span></button>`).join('');
}

function canView(path){if((path||'').includes('사용메뉴얼'))return true;const a=window.MES_AUTH;return !a||!a.session?true:a.can(path,'view')}
function currentGroups(){
  const gs=APP[activeModule]?.menus?.[activeSecondary]||[];
  return gs.map(g=>({name:g.name,items:g.items.filter(n=>canView(activeModule+'/'+activeSecondary+'/'+n))}))
           .filter(g=>g.items.length);
}
/* 화면파일 → 메뉴경로 (iframe의 mes_db.js가 권한 판단에 사용) */
window.MES_MENU_OF=function(file){
  for(const [mod,cfg] of Object.entries(APP))
    for(const [sec,groups] of Object.entries(cfg.menus||{}))
      for(const g of groups)for(const n of g.items)
        if(pageRegistry[n]?.file===file)return mod+'/'+sec+'/'+n;
  return null;
};
function buildTree(){
  const gs=currentGroups();
  if(!gs.length){tree.innerHTML='<div style="padding:16px;color:#7a8793">'+(activeModule?'등록된 하위 메뉴가 없습니다.':'상단에서 업무 메뉴를 선택하세요.')+'</div>';return}
  tree.innerHTML=gs.map(g=>`<div class="group"><div class="group-title">${g.name}</div>${g.items.map(name=>`<button class="item ${pageRegistry[name]?.id===activeId?'on':''}" onclick="openByName('${name}')">${name}</button>`).join('')}</div>`).join('')
}
function setModule(m){
  activeModule=m;
  const secs=APP[m]?.secondary||[];
  activeSecondary=secs[0]?.name||'';
  buildModules();buildSecondary();buildTree();
  statusMsg.textContent=`${m} 메뉴를 선택했습니다.`

function setSecondary(s){activeSecondary=s;buildSecondary();buildTree();statusMsg.textContent=`${activeModule} / ${s}`}
function slugify(name){const map={'수주등록':'sale_order_input','수주현황':'sale_order_status','구매품 발주':'purchase_order_input','구매품 입고':'purchase_receipt_input','구매품 발주현황':'purchase_order_status','가공계획등록':'machining_plan_input','외주가공 발주':'outsourcing_order_input','외주가공 입고':'outsourcing_receipt_input','외주가공 입고확정':'outsourcing_receipt_confirmation','외주가공발주현황':'outsourcing_order_status','가공구매 진척현황':'machining_purchase_progress','사용자정보':'user_info','검사구분':'inspection_category','직급정보':'position_info','자재단가변동등록':'material_price_change_input','자재단가변동현황':'material_price_change_status','공정단가변동등록':'process_price_change_input','공정단가변동현황':'process_price_change_status'};return map[name]||'pending_'+Math.abs([...name].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0))}
function openByName(name){let p=pageRegistry[name];if(!p){const id=slugify(name);p={id,title:name,file:null};pageRegistry[name]=p}openPage(p)}
function openPage(p){if(!openTabs.has(p.id))openTabs.set(p.id,p);activeId=p.id;renderTabs();renderStage();buildTree();statusMsg.textContent=p.file?`${p.title} 화면을 열었습니다.`:`${p.title} 화면은 사진 등록 대기중입니다.`}
function renderTabs(){tabs.innerHTML=[...openTabs.values()].map(p=>`<div class="tab ${p.id===activeId?'on':''}" onclick="activate('${p.id}')"><span class="title">${p.title}</span><button class="x" onclick="closeTab('${p.id}',event)">×</button></div>`).join('');requestAnimationFrame(()=>tabs.querySelector('.tab.on')?.scrollIntoView({inline:'nearest'}))}
/* 화면 iframe에 공용 우클릭 메뉴/삭제확인 스크립트 자동 주입
   (각 HTML을 수정하지 않아도 되며, 이미 들어있는 화면은 건너뜀) */
function injectCtx(f){
 try{
  const doc=f.contentDocument;
  if(!doc||!doc.body)return;
  if(doc.__mesCtxInjected||doc.querySelector('script[src*="mes_ctx.js"]'))return;
  doc.__mesCtxInjected=1;
  const s=doc.createElement('script');
  s.src='mes_ctx.js?v='+APP_VER;   /* 삭제 확인 다이얼로그 */
  doc.body.appendChild(s);
  /* v64: 외주 물류이동(보유처·체류일) 모듈 — 해당 화면에서만 스스로 동작한다 */
  if(!doc.querySelector('script[src*="mes_move.js"]')){
   const m=doc.createElement('script');
   m.src='mes_move.js?v='+APP_VER;
   doc.body.appendChild(m);
  }
 }catch(e){/* 교차출처(file://)면 무시 — 이때는 각 HTML에 직접 넣어야 함 */}
}
/* v44: 새 화면은 DB 로딩이 끝난 뒤 한 번에 보여준다.
   (이전에는 빈 화면 → 내장 예시자료 → DB자료 순으로 두세 번 바뀌어 보였다) */
const VREADY=new Set();
let vwaitTimer=null,pendingId=null;
function badgeOff(){try{return localStorage.getItem('mes_badge')==='off'}catch(e){return false}}
function viewReady(f){
  if(!f||f.tagName!=='IFRAME')return true;
  try{
    const d=f.contentDocument,w=f.contentWindow;
    if(!d||d.readyState!=='complete')return false;
    if(d.documentElement.classList.contains('mesdb-loading'))return false;
    if(w.__mesdbBound&&!badgeOff()&&!d.getElementById('mesdb-badge')&&!(w.MESDB&&w.MESDB.syncMaster))return false;
    return true;
  }catch(e){return true}
}
function makeView(p){
  if(document.getElementById('view_'+p.id))return;
  if(p.file){
    const f=document.createElement('iframe');f.id='view_'+p.id;
    f.src=p.file+(p.file.includes('?')?'&':'?')+'v='+APP_VER;
    f.addEventListener('load',()=>injectCtx(f));
    stage.appendChild(f);
  }else{
    const d=document.createElement('div');d.id='view_'+p.id;d.className='placeholder';
    d.innerHTML=`<div><b>${esc(p.title)}</b><br><br>해당 업무 화면 사진을 주시면 <code>${p.id}.html</code> 형태로 제작해 이 위치에 연결합니다.</div>`;
    stage.appendChild(d);
  }
}
function swapTo(id){
  clearTimeout(vwaitTimer);pendingId=null;VREADY.add(id);
  vwait.classList.remove('on');
  stage.querySelectorAll('iframe,.placeholder').forEach(x=>x.classList.toggle('on',x.id==='view_'+id));
}
function renderStage(){
  for(const p of openTabs.values())makeView(p);
  const el=document.getElementById('view_'+activeId);
  if(!el){vwait.classList.remove('on');return}
  if(VREADY.has(activeId)||viewReady(el)){swapTo(activeId);return}
  /* 아직 준비 전 — 이전 화면을 그대로 두고 대기 표시 */
  pendingId=activeId;vwait.classList.add('on');
  const t0=Date.now();
  clearTimeout(vwaitTimer);
  (function poll(){
    if(pendingId!==activeId)return;
    const f=document.getElementById('view_'+activeId);
    if(!f||viewReady(f)||Date.now()-t0>3000){swapTo(activeId);return}
    vwaitTimer=setTimeout(poll,60);
  })();
}
function activate(id){activeId=id;renderTabs();renderStage();buildTree()}
/* v36: 선반입(prefetch) — 클릭 전에 화면 파일을 캐시에 올려 대기시간을 줄인다 */
const _pf=new Set();
function prefetch(url){if(!url||_pf.has(url))return;_pf.add(url);
  try{const l=document.createElement('link');l.rel='prefetch';l.href=url;l.as='document';document.head.appendChild(l)}catch(e){}
  try{fetch(url,{cache:'force-cache'}).catch(()=>{})}catch(e){}}
tree.addEventListener('mouseover',e=>{const b=e.target.closest('.item');if(!b)return;
  const p=pageRegistry[b.textContent.trim()];if(p&&p.file)prefetch(p.file+'?v='+APP_VER)});
(window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>{
  ['mes_db.js?v='+APP_VER,'mes_ctx.js?v='+APP_VER,'mes_lookup.js?v='+APP_VER,'mes_paste.js?v='+APP_VER,'mes_auth.js?v='+APP_VER,'mes_move.js?v='+APP_VER].forEach(prefetch);
  let i=0;const hot=['sale_order_status.html','purchase_order_input.html','purchase_order_status.html',
    'material_order_input.html','outsourcing_order_input.html','vendor_management.html','status_board.html'];
  const step=()=>{if(i>=hot.length)return;prefetch(hot[i++]+'?v='+APP_VER);setTimeout(step,600)};step()});
function closeTab(id,e){e?.stopPropagation();const ids=[...openTabs.keys()],idx=ids.indexOf(id);openTabs.delete(id);VREADY.delete(id);document.getElementById('view_'+id)?.remove();if(activeId===id){activeId=ids[idx+1]||ids[idx-1]||'';if(!openTabs.has(activeId))activeId=[...openTabs.keys()][0]||''}renderTabs();renderStage();buildTree()}
function closeActive(){if(activeId)closeTab(activeId)}

buildModules();buildSecondary();buildTree();renderTabs();renderStage();tick();setInterval(tick,1000);

/* ── v46 화면확대(Ctrl+휠) 대응 ─────────────────────────────
 * 확대하면 상단 메뉴바가 한 줄에 다 안 들어가 잘려 보였다.
 * 메뉴가 아랫줄로 접히도록 바꾸고, 접힌 높이만큼 --top1/--top2 를
 * 실제 높이로 갱신해 좌측 트리·작업영역이 겹치지 않게 한다. */
(function(){
  var root=document.documentElement;
  var h1=document.querySelector('.top1'), h2=document.querySelector('.top2');
  if(!h1||!h2)return;
  var last1=0,last2=0,queued=false;
  function measure(){
    queued=false;
    var a=Math.ceil(h1.getBoundingClientRect().height);
    var b=Math.ceil(h2.getBoundingClientRect().height);
    if(a&&Math.abs(a-last1)>=1){last1=a;root.style.setProperty('--top1',a+'px')}
    if(b&&Math.abs(b-last2)>=1){last2=b;root.style.setProperty('--top2',b+'px')}
  }
  /* 관측 콜백 안에서 곧바로 스타일을 바꾸면 ResizeObserver 경고가 난다 → 다음 프레임에 한 번만 */
  function sync(){if(queued)return;queued=true;
    (window.requestAnimationFrame||setTimeout)(measure)}
  if(window.ResizeObserver){
    var ro=new ResizeObserver(sync);
    ro.observe(h1);ro.observe(h2);
  }
  window.addEventListener('resize',sync);
  document.addEventListener('DOMContentLoaded',measure);
  /* 메뉴 버튼이 새로 그려질 때(모듈/2차메뉴 전환)도 반영 */
  var mo=new MutationObserver(function(){requestAnimationFrame(sync)});
  mo.observe(h1,{childList:true,subtree:true});
  mo.observe(h2,{childList:true,subtree:true});
  measure();setTimeout(measure,300);
})();

/* v45: 좌측 메뉴창 폭 조절(드래그) */
(function(){
  var KEY='mes_left_w', MIN=180, MAX=700, DEF=300;
  var root=document.documentElement, sp=document.getElementById('splitter');
  if(!sp)return;
  function apply(w){root.style.setProperty('--left',w+'px')}
  function save(w){try{localStorage.setItem(KEY,String(w))}catch(e){}}
  function load(){try{var v=parseInt(localStorage.getItem(KEY),10);return isNaN(v)?0:v}catch(e){return 0}}
  function restore(){
    if(window.innerWidth<=680){root.style.removeProperty('--left');return}
    var w=load(), lim=Math.min(MAX,Math.max(MIN,window.innerWidth-320));
    if(w>=MIN)apply(Math.min(w,lim));
  }
  restore();
  var drag=false;
  sp.addEventListener('pointerdown',function(e){
    drag=true;
    try{sp.setPointerCapture(e.pointerId)}catch(_){}
    sp.classList.add('drag');document.body.classList.add('resizing');
    e.preventDefault();
  });
  sp.addEventListener('pointermove',function(e){
    if(!drag)return;
    var lim=Math.min(MAX,window.innerWidth-320);
    var w=Math.round(e.clientX);
    if(w<MIN)w=MIN; if(w>lim)w=lim;
    apply(w);
  });
  function end(e){
    if(!drag)return; drag=false;
    try{sp.releasePointerCapture(e.pointerId)}catch(_){}
    sp.classList.remove('drag');document.body.classList.remove('resizing');
    var w=parseInt(getComputedStyle(root).getPropertyValue('--left'),10)||DEF;
    save(w);
    try{statusMsg.textContent='메뉴 창 폭을 '+w+'px 로 조절했습니다.'}catch(_){}
  }
  sp.addEventListener('pointerup',end);
  sp.addEventListener('pointercancel',end);
  sp.addEventListener('dblclick',function(){apply(DEF);save(DEF);
    try{statusMsg.textContent='메뉴 창 폭을 기본값(300px)으로 되돌렸습니다.'}catch(_){}});
  window.addEventListener('resize',restore);
})();

</script>
