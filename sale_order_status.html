<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수주현황</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.frow{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:center}
.frow+.frow{margin-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.f2{display:grid;grid-template-columns:repeat(4,max-content minmax(120px,200px));gap:6px 8px;align-items:center;justify-content:start}
.f2 .lb{font-weight:700;text-align:right;padding-right:2px;white-space:nowrap}
.f2>.lb:not(:first-child){margin-left:22px}
.f2 .field{width:100%}
@media(max-width:1500px){.f2{grid-template-columns:repeat(3,max-content minmax(110px,190px))}}
@media(max-width:1150px){.f2{grid-template-columns:repeat(2,max-content minmax(110px,1fr))}.f2>.lb:not(:first-child){margin-left:12px}}
.gtot td{background:#dfe9f2;font-weight:700}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}

/* v46 상세 팝업 */
.dqmask{position:fixed;inset:0;background:rgba(40,50,60,.32);display:none;align-items:flex-start;justify-content:center;z-index:60}
.dqmask.on{display:flex}
.dqdlg{margin-top:48px;width:min(760px,94vw);max-height:82vh;display:flex;flex-direction:column;background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.28)}
.dqhead{display:flex;align-items:center;height:32px;padding:0 6px 0 12px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dqhead button{margin-left:auto;width:28px;height:22px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer;line-height:1}
.dqbody{padding:12px;overflow:auto;flex:1 1 auto}
/* v60: 행을 클릭하면 이 팝업이 푸터를 덮어 [수정]을 누를 수 없다 → 팝업 안에도 둔다 */
.dqfoot{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#eef2f5;border-top:1px solid #c5d0d8;flex:0 0 auto}
.dqfoot .sp{margin-left:auto}
.dgrid{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:1px;background:#c5d0d8;border:1px solid #c5d0d8}
.dgrid .dl{background:#e8f1f8;font-weight:700;padding:6px 8px}
.dgrid .dv{background:#fff;padding:6px 8px;min-height:16px;word-break:break-all}
@media(max-width:700px){.dgrid{grid-template-columns:100px 1fr}}
</style></head><body><div class="screen">
<div class="title"><h1>수주현황</h1><small>1공장</small></div>
<section class="filt">
 <div class="frow"><div class="label">구 분</div><div class="opts">
   <label><input type="radio" name="st" value="전체" checked>전체</label>
   <label><input type="radio" name="st" value="진행">진행</label>
   <label><input type="radio" name="st" value="완료">완료</label>
   <span style="display:inline-block;width:1px;height:18px;background:#9aa8b4;margin:0 14px;vertical-align:middle"></span>
   <span style="font-weight:700">수주유형</span>
   <label><input type="radio" name="ot" value="전체" checked>전체</label>
   <label><input type="radio" name="ot" value="신작">신작</label>
   <label><input type="radio" name="ot" value="개조">개조</label>
   <label><input type="radio" name="ot" value="수리">수리</label>
 </div></div>
 <div class="frow"><div></div><div class="f2">
   <div class="lb">모 델</div><div><input id="q_model" class="field"></div>
   <div class="lb">도 번</div><div><input id="q_draw" class="field"></div>
   <div class="lb">제 번</div><div><input id="q_job" class="field"></div>
   <div class="lb">품 명</div><div><input id="q_item" class="field"></div>
   <div class="lb">국내/해외</div><div><select id="q_dom" class="field"><option value=""></option><option>국내</option><option>해외</option></select></div>
   <div class="lb">고객사</div><div><input id="q_cust" class="field"></div>
   <div class="lb">양산처</div><div><input id="q_mp" class="field"></div>
 </div></div>
</section>
<div class="gridbox"><table style="min-width:1740px">
 <thead><tr>
  <th style="width:44px">NO</th><th style="width:104px">제번</th><th style="width:112px">모델</th><th style="width:112px">도번</th>
  <th style="width:180px">품명</th><th style="width:72px">ECO</th><th style="width:140px">고객사</th><th style="width:48px">공정</th>
  <th style="width:70px">개발유형</th><th style="width:70px">수주유형</th><th style="width:96px">금형타입</th><th style="width:78px">기계사양</th>
  <th style="width:92px">수주일</th><th style="width:104px">Try-Out 예정일</th><th style="width:92px">완료일</th><th style="width:110px">양산처</th><th style="width:60px">상태</th>
 </tr></thead>
 <tbody id="body"></tbody>
 <tfoot><tr class="gtot"><td colspan="17" class="c" id="totline">조회 건수 0건</td></tr></tfoot>
</table></div>
<footer class="foot"><button class="btn" onclick="detail()">⌕ 상세보기</button><button class="btn" onclick="detail(1)">⌕ 상세보기(관리자)</button><button class="btn" onclick="editOrder()" title="선택한 수주를 수주정보 등록 화면에 불러와 수정합니다.">✎ 수정</button><button class="btn" onclick="newOrder()" title="빈 화면으로 새 수주를 등록합니다.">＋ 등록</button><button class="btn" id="btnDel" onclick="delOrder()">✕ 삭제</button><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="exportCsv()">▤ EXCEL</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">등록된 수주를 조회합니다. 행을 더블클릭하면 상세정보가 열립니다.</span><span class="right" id="countText"></span></footer>
<div class="dqmask" id="dQMask" onclick="if(event.target===dQMask)closeDetail()"><div class="dqdlg"><div class="dqhead"><span id="dQTitle">수주 상세</span><button onclick="closeDetail()">×</button></div><div class="dqbody" id="dQBody"></div>
<div class="dqfoot"><button class="btn" onclick="editOrder()">✎ 수정</button><button class="btn" onclick="delOrder()">✕ 삭제</button><span class="sp"></span><button class="btn" onclick="closeDetail()">⊠ 닫기</button></div></div></div>
</div><script>
const data=[];
let view=[...data],sel=-1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=n=>document.querySelector(`input[name="${n}"]:checked`).value;
const v=id=>document.getElementById(id).value.trim().toLowerCase();
let AMT={};   /* job_no -> {quotation_price, order_price, sales_price} */
function renderTotal(){
  const money=v=>Number(v||0).toLocaleString('ko-KR');
  let q=0,o=0,sl=0,n=0;
  for(const r of view){const a=AMT[r.job_no];if(a){q+=Number(a.quotation_price)||0;o+=Number(a.order_price)||0;sl+=Number(a.sales_price)||0;n++}}
  totline.textContent = view.length
    ? `조회 ${view.length}건 · 견적가 ${money(q)} · 수주가 ${money(o)} · 판매가 ${money(sl)}`
      + (n<view.length?`  (금액 미등록 ${view.length-n}건 제외)`:'')
    : '조회된 수주가 없습니다.';
}
async function loadAmounts(){
  if(!window.MESDB)return;
  try{
    const rs=await MESDB.table('sale_orders').select('select=job_no,quotation_price,order_price,sales_price');
    AMT={}; rs.forEach(r=>AMT[r.job_no]=r); renderTotal();
  }catch(e){}
}
function render(){
 body.innerHTML=view.length?view.map((r,i)=>`<tr onclick="pick(${i},this)" ondblclick="detail()" title="더블클릭하면 상세정보가 열립니다."><td class="c">${i+1}</td><td>${esc(r.job_no)}</td><td>${esc(r.model||'')}</td><td>${esc(r.drawing_no||'')}</td><td>${esc(r.item_name||'')}</td><td>${esc(r.eco||'')}</td><td>${esc(r.customer_name||'')}</td><td class="c">${r.set_qty??''}</td><td class="c">${esc(r.development_type||'')}</td><td class="c">${esc(r.order_type||'')}</td><td>${esc(r.mold_type_name||'')}</td><td class="c">${esc(r.machine_spec_name||'')}</td><td class="c">${esc(r.order_date||'')}</td><td class="c">${esc(r.s1_planned_date||'')}</td><td class="c">${esc(r.completion_date||'')}</td><td>${esc(r.mass_production_vendor_name||'')}</td><td class="c">${esc(r.order_status)}</td></tr>`).join('')
 :'<tr><td colspan="17" class="c" style="height:120px;color:#8a97a2">조회결과가 없습니다.</td></tr>';
 countText.textContent=view.length+'건';sel=-1;
 renderTotal();
}
function pick(i,tr){sel=i;document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel')}
function search(){
 const st=g('st'),ot=g('ot'),m=v('q_model'),d=v('q_draw'),j=v('q_job'),it=v('q_item'),b='',c=v('q_cust'),mp=v('q_mp');
 view=data.filter(r=>(st==='전체'||r.order_status===st)&&(ot==='전체'||r.order_type===ot)
  &&(!m||String(r.model??'').toLowerCase().includes(m))&&(!d||String(r.drawing_no??'').toLowerCase().includes(d))
  &&(!j||r.job_no.toLowerCase().includes(j))&&(!it||String(r.item_name??'').toLowerCase().includes(it))
  &&(!c||String(r.customer_name??'').toLowerCase().includes(c))&&(!mp||String(r.mass_production_vendor_name??'').toLowerCase().includes(mp)));
 render();message.textContent=`조회결과 ${view.length}건입니다.`;
}
function detail(admin){
 if(sel<0){message.textContent='목록에서 행을 선택하세요.';return}
 openDetail(view[sel]);
}
/* ── v46 상세 팝업: 항목 클릭 시 수주 상세정보 표시 ─────────────── */
const DFIELDS=[['job_no','제번'],['plant_name','공장'],['order_status','수주상태'],['order_type','수주유형'],
 ['quotation_no','견적서번호'],['item_name','품명(아이템)'],['order_date','수주일'],['s1_planned_date','Try-Out 예정일'],
 ['delivery_planned_date','납기예정일'],['domestic_overseas','국내/해외'],['drawing_no','도번'],
 ['manager_name','담당자'],['customer_name','고객사'],['mold_type_name','금형타입'],['development_type','개발유형'],
 ['mass_production_vendor_name','양산처'],['product_name','품명'],['model','모델'],['process_set_qty','공정'],
 ['quotation_price','견적가'],['machine_spec_name','기계사양'],['material_used','사용재료'],
 ['s1_completed_date','Try-Out 완료일'],['delivery_completed_date','납기완료일'],['eco','ECO'],
 ['order_price','수주가'],['sales_price','판매가'],['completion_date','완료일'],['remark','비고']];
async function openDetail(r){
 if(!r)return;
 let d=r;
 if(window.MESDB&&MESDB.online){
  try{const rs=await MESDB.table('sale_orders').select(`select=*&job_no=eq.${encodeURIComponent(r.job_no)}&limit=1`);
   if(rs&&rs[0])d={...r,...rs[0]};}catch(e){}
 }
 const money=v=>v==null||v===''?'':Number(v).toLocaleString('ko-KR');
 const rows=DFIELDS.map(([k,l])=>{let v=d[k];if(['quotation_price','order_price','sales_price'].includes(k))v=money(v);
   return `<div class="dl">${l}</div><div class="dv">${esc(v??'')}</div>`}).join('');
 let att='';
 if(Array.isArray(d.attachments)&&d.attachments.length){
  att='<div class="dl">첨부파일</div><div class="dv">'+d.attachments.map(a=>`<a href="https://ipggvrzxfcryzryileuv.supabase.co/storage/v1/object/public/mes-attach/${a.path.split('/').map(encodeURIComponent).join('/')}" target="_blank">${esc(a.name)}</a>`).join('<br>')+'</div>';
 }
 dQBody.innerHTML=`<div class="dgrid">${rows}${att}</div>`;
 dQTitle.textContent=`수주 상세 - ${d.job_no}`;
 dQMask.classList.add('on');
}
function closeDetail(){dQMask.classList.remove('on')}

/* ── v60 수정/등록: 수주정보 등록 화면으로 넘긴다 ────────────────
 * 이미 열려 있는 탭이면 그 iframe 의 MES.loadJob() 을 직접 호출하고,
 * 아직 안 열려 있으면 부모 window 에 인계값을 두고 새 화면이 스스로 읽게 한다. */
function inputFrame(P){
 try{return [...P.document.querySelectorAll('iframe')].find(f=>String(f.src||'').includes('sale_order_input.html'))||null}
 catch(e){return null}
}
function openInput(job){
 let P=null;try{P=window.parent}catch(e){}
 if(!P||P===window||typeof P.openByName!=='function'){
  message.textContent='수주정보 등록 화면을 열 수 없습니다. 메뉴에서 직접 열어 주세요.';return false}
 try{P.__mesHandoff={file:'sale_order_input.html',job_no:job||null,at:Date.now()}}catch(e){}
 const fr=inputFrame(P);                 /* openByName 이전에 잡아야 '기존 탭'인지 알 수 있다 */
 P.openByName('수주등록');
 if(fr&&fr.contentWindow&&typeof fr.contentWindow.MES?.loadJob==='function'){
  try{fr.contentWindow.MES.loadJob(job||null);try{delete P.__mesHandoff}catch(e){}}catch(e){}
 }
 return true;
}
function editOrder(){
 if(sel<0){message.textContent='수정할 수주를 목록에서 선택하세요.';return}
 const r=view[sel];
 closeDetail();
 if(openInput(r.job_no))message.textContent=`${r.job_no} 을(를) 수주정보 등록 화면에서 수정하세요.`;
}
function newOrder(){
 closeDetail();
 if(openInput(null))message.textContent='수주정보 등록 화면을 열었습니다.';
}

async function delOrder(){
 if(sel<0){message.textContent='삭제할 수주를 목록에서 선택하세요.';return}
 const r=view[sel];
 closeDetail();
 /* v62: 하위 자료(SET발주·발주라인·제작계획·경비)가 있으면 삭제 차단 — 고아 방지 */
 if(window.MESDB&&MESDB.online){
  try{
   const j=encodeURIComponent(r.job_no);
   const [sl,ol,pl,ex]=await Promise.all([
    MESDB.table('set_order_lines').select(`select=line_id&job_no=eq.${j}`),
    MESDB.table('order_lines').select(`select=line_id&job_no=eq.${j}`),
    MESDB.table('sales_plans').select(`select=row_no&job_no=eq.${j}`),
    MESDB.table('expenses').select(`select=expense_id&job_no=eq.${j}`)]);
   const cnt=[['SET발주',sl],['발주라인',ol],['제작계획',pl],['경비',ex]].filter(([,a])=>a&&a.length).map(([n,a])=>`${n} ${a.length}건`);
   if(cnt.length){message.textContent=`${r.job_no} 은(는) 하위 자료(${cnt.join(', ')})가 있어 삭제할 수 없습니다. 해당 자료를 먼저 삭제·취소하세요.`;return}
  }catch(e){message.textContent='하위 자료 확인 실패로 삭제할 수 없습니다: '+String(e.message||e).slice(0,100);return}
 }
 if(!confirm(`${r.job_no} / ${r.item_name||''} 수주를 삭제할까요?\n(수주현황 목록 및 sale_orders에서 제거됩니다. 제번(jobs)은 유지)`))return;
 const idx=data.findIndex(x=>x.row_no===r.row_no);
 if(idx>=0)data.splice(idx,1);
 search();
 if(window.MESDB&&MESDB.online){
  try{
   if(!data.some(x=>x.job_no===r.job_no))await MESDB.table('sale_orders').delete({job_no:r.job_no});
   MESDB.syncMaster&&await MESDB.syncMaster();
   try{MESDB.notify&&MESDB.notify(['sale_orders'])}catch(e){}   /* 열려 있는 수주등록 탭에 알림 */
   delete AMT[r.job_no];renderTotal();
  }catch(e){message.textContent='DB 삭제 실패: '+String(e.message||e).slice(0,120);return}
 }
 message.textContent=`${r.job_no} 수주를 삭제했습니다.`;
}
function exportCsv(){
 const h=['제번','모델','도번','품명','ECO','고객사','공정','개발유형','수주유형','금형타입','기계사양','수주일','Try-Out예정일','완료일','양산처','상태'];
