<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가공계획등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.guide{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;justify-content:flex-end;min-width:0;overflow:hidden;font-size:11.5px;line-height:1}
.guide .gt{font-weight:700;color:#2e78bd;margin-right:1px;white-space:nowrap}
.guide .st{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 4px;border:1px solid #b9cfe4;border-radius:10px;background:#f2f8fd;color:#33506b;white-space:nowrap;flex:0 0 auto}
.guide .st b{width:14px;height:14px;border-radius:50%;background:#2e78bd;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.guide .ar{color:#9db4c8;font-size:10px;flex:0 0 auto}
.guide .warn{color:#c0392b;font-weight:700;margin-left:3px;white-space:nowrap;flex:0 0 auto}
@media(max-width:1450px){.guide .gt,.guide .ar{display:none}}
@media(max-width:1150px){.guide .st b{margin-right:-2px}.guide .warn{display:none}}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
/* v81: 가공 공정 리스트 인라인 편집(드롭다운) */
.phbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.phbar .btn{height:23px;min-width:0;padding:0 9px;font-size:11px;font-weight:400}
.phbar .sp{margin-left:auto;font-weight:400;color:#5d6f7f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.pad0{padding:1px 2px}
.rsel{width:100%;height:23px;border:1px solid #c3ccd4;background:#fff;font:inherit;padding:0 1px}
.rsel.on{background:#eef5fc;border-color:#6f9fd0}
.rname{width:100%;height:23px;border:1px solid #c3ccd4;background:#fff;font:inherit;padding:0 4px}
#rbody tr.sel td{background:#dbeaf7;color:var(--ink)}
#rbody tr.dirty td{background:#fff6e0}
#rbody tr.dirty.sel td{background:#f6ecd4}
#rbody tr.sel td{box-shadow:inset 0 -2px 0 #2e78bd}
#rbody tr.sel td:first-child{box-shadow:inset 2px 0 0 #2e78bd,inset 0 -2px 0 #2e78bd}
#rbody tr.dirty .rname{border-color:#d8a33c}
</style></head><body><div class="screen"><div class="title"><h1>가공계획등록</h1><small>구매관리 · 가공</small></div><section class="filt"><div class="f2"><div class="lb">제 번</div><div><input id="q_job" class="field"></div><div class="lb">품 명</div><div><input id="q_item" class="field"></div><div class="guide" style="grid-column:span 4"><span class="gt">사용순서</span><span class="st"><b>1</b>제번·조 선택</span><span class="ar">▸</span><span class="st"><b>2</b>기준공정 체크</span><span class="ar">▸</span><span class="st"><b>3</b>공정 수정 시 [공정저장]</span><span class="ar">▸</span><span class="st"><b>4</b>[부품에 적용]</span><span class="ar">▸</span><span class="st"><b>5</b>[저장]</span><span class="warn">※ 체크 없으면 전체 저장</span></div></div></section><div class="panes" style="grid-template-rows:1fr 1.2fr"><div class="panes" style="grid-template-columns:470px 1fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">제번 리스트</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:46px">NO</th><th style="width:130px">제번</th><th style="width:64px">공정(조)수</th><th style="width:40px">조</th><th style="width:104px">가공완료일</th><th>T/O 예정일</th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="pane"><div class="ph"><div class="phbar"><span>가공 공정 리스트</span><button class="btn" onclick="routeAdd()" title="기준공정 행을 추가합니다">+ 행추가</button><button class="btn" onclick="routeSave()" title="변경된 기준공정을 저장합니다">▤ 공정저장</button><button class="btn" onclick="routeDel()" title="체크한 기준공정을 삭제합니다">✕ 공정삭제</button><button class="btn" onclick="applySeq()" title="선택한 기준공정의 공정순서를 아래 부품에 적용합니다">▣ 부품에 적용</button><span class="sp" id="routeMsg">공정 칸을 드롭다운으로 직접 고른 뒤 [▤ 공정저장]</span></div></div><div class="pb"><table style="min-width:1240px"><thead><tr><th style="width:32px"><input type="checkbox" onclick="rchkAll(this)" title="전체선택"></th><th style="width:62px">기준공정</th><th style="width:170px">기준공정명</th><th style="width:96px">공정1</th><th style="width:96px">공정2</th><th style="width:96px">공정3</th><th style="width:96px">공정4</th><th style="width:96px">공정5</th><th style="width:96px">공정6</th><th style="width:96px">공정7</th><th style="width:96px">공정8</th><th style="width:96px">공정9</th><th style="width:96px">공정10</th></tr></thead><tbody id="rbody"></tbody></table></div></div></div><div class="pane"><div class="ph">부품 리스트</div><div class="pb"><table style="min-width:1500px"><thead><tr><th style="width:36px"></th><th style="width:110px">부품코드</th><th style="width:180px">부품명</th><th style="width:90px">기준공정</th><th style="width:88px">공정1</th><th style="width:88px">공정2</th><th style="width:88px">공정3</th><th style="width:88px">공정4</th><th style="width:88px">공정5</th><th style="width:88px">공정6</th><th style="width:88px">공정7</th><th style="width:88px">공정8</th><th style="width:88px">공정9</th><th style="width:88px">공정10</th><th style="width:88px">공정11</th><th style="width:88px">공정12</th></tr></thead><tbody id="pbody"></tbody></table></div></div></div> <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="sampleFill()" title="화면 순서대로 시연하며 등록요점을 설명합니다.">▶ 등록예제</button><button class="btn" onclick="del_()">✕ 삭제</button><button class="btn" onclick="pr()">▤ PRINT</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번을 선택하면 부품별 가공공정이 표시됩니다.</span><span class="right" id="countText"></span></footer></div><script>const heads=[];const routes=[];const parts=[];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...heads];
/* v80: 공정 칸은 코드 대신 공정명으로 보여준다 (코드는 툴팁으로 유지) */
const PROCN={};
async function loadProcs(){
 try{const rs=await MESDB.table('processes').select('select=process_code,process_name');
  Object.keys(PROCN).forEach(k=>delete PROCN[k]);
  (rs||[]).forEach(r=>{if(r.process_code)PROCN[r.process_code]=r.process_name||r.process_code});
 }catch(e){}
}
const pname=c=>{const k=String(c||'').trim();return k?(PROCN[k]||k):''};
const cells=(a,n)=>Array.from({length:n},(_,i)=>{const c=a&&a[i]||'';
 return `<td class="c" title="${esc(c)}">${esc(pname(c))}</td>`}).join('');
function render(){
 hbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)"><td class="c">${r.row_no}</td><td>${esc(r.job_no)}</td><td class="c">${r.set_qty||''}</td><td class="c">${r.jo||''}</td><td class="c">${esc(r.machining_completion_date||'')}</td><td class="c">${esc(r.s1_date||'')}</td></tr>`).join('');
 renderRoutes();
 countText.textContent=view.length+'건';pbody.innerHTML='';
}
let selIdx=-1;
const PROW=p=>`<tr><td class="c"><input type="checkbox" data-i="${parts.indexOf(p)}" data-row="${p.row_no??''}"></td><td>${esc(p.part_no)}</td><td>${esc(p.part_name)}</td><td class="c">${esc(p.standard_process||'')}</td>${cells(p.steps,12)}</tr>`;
const PEMPTY='<tr><td colspan="16" class="c" style="height:100px;color:#8a97a2">이 조의 PartList 부품이 없습니다. 설계관리 &gt; PartList 등록(원재료)에서 해당 조로 부품을 먼저 등록하세요.</td></tr>';
function pick(i,tr){const r=view[i];if(!r)return;selIdx=i;
 document.querySelectorAll('#hbody tr').forEach((x,k)=>x.classList.toggle('sel',k===i));
 if(typeof loadParts==='function')return loadParts(r.job_no,r.jo);
 const rs=parts.filter(p=>p.job_no===r.job_no);
 pbody.innerHTML=rs.length?rs.map(PROW).join(''):PEMPTY;
 msg(`${r.job_no} / ${r.jo}조 (${r.jo}/${r.set_qty}) · 부품 ${rs.length}건`);}
function search(){const j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase();
 view=heads.filter(r=>(!j||String(r.job_no||'').toLowerCase().includes(j))
   &&(!it||String(r.item_name||'').toLowerCase().includes(it)));
 selIdx=-1;render();
 if(view.length===1)pick(0);
 msg(`조회결과 ${view.length}건입니다.`);}
/* ── v81: 제번·품명 입력칸을 드롭다운+직접입력 콤보(datalist)로 ──────────
 * 글자를 치면 목록이 걸러지고, 목록에 없는 값도 그대로 입력해 조회할 수 있다. */
function makeDL(id,opts){
 let dl=document.getElementById(id);
 if(!dl){dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl)}
 dl.innerHTML=opts.map(o=>`<option value="${esc(o.v)}">${esc(o.s||'')}</option>`).join('');
 return dl;
}
let _pickerBound=false;
function buildPickers(){
 makeDL('dl_job',[...new Map(heads.map(r=>[r.job_no,{v:r.job_no,s:(r.item_name||'')+' · '+r.set_qty+'조'}])).values()]);
 q_job.setAttribute('list','dl_job');q_job.setAttribute('autocomplete','off');
 q_job.placeholder=heads.length?`제번 입력/선택 (${heads.length}건)`:'제번 입력';
 q_job.title='등록된 제번 목록입니다. 글자를 입력하면 걸러집니다.';
 const items=[...new Set(heads.map(r=>r.item_name).filter(Boolean))];
 makeDL('dl_item',items.map(v=>({v})));
 q_item.setAttribute('list','dl_item');q_item.setAttribute('autocomplete','off');
 q_item.placeholder=items.length?`품명 입력/선택 (${items.length}건)`:'품명 입력';
 q_item.title='등록된 품명 목록입니다. 글자를 입력하면 걸러집니다.';
 if(!_pickerBound){
  _pickerBound=true;
  q_job.addEventListener('change',()=>{const v=(q_job.value||'').trim();
    search();                                   /* 1건이면 search() 안에서 이미 선택됨 */
    if(view.length!==1){const k=view.findIndex(r=>r.job_no===v);if(k>=0)pick(k)}});
  q_item.addEventListener('change',()=>search());
  [q_job,q_item].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();search()}}));
 }
 try{window.MESCOMBO&&MESCOMBO.scan()}catch(e){}   /* 공용 콤보 UI 로 승격 */
}
/* v39: 스텁 → machining_plans / machining_plan_parts 실제 저장 */
const _online=()=>!!(window.MESDB&&MESDB.online);
const OWNER=()=>{try{return (window.MES_AUTH||window.parent.MES_AUTH)?.name||''}catch(e){return ''}};
async function save(){
 const job=(view[selIdx]&&view[selIdx].job_no)||(q_job.value||'').trim();
 if(!job)return msg('제번을 선택하세요.');
 if(!_online())return msg('DB 미연결 상태에서는 저장할 수 없습니다.');
 try{
  const h=view[selIdx]||{};
  const jo=h.jo||'1';
  const ex=await MESDB.table('machining_plans').select(`select=row_no&job_no=eq.${encodeURIComponent(job)}&process_code=eq.${encodeURIComponent(jo)}&limit=1`);
  let rowNo=(ex&&ex[0])?Number(ex[0].row_no):null;
  /* v39: 신규는 row_no 미전달(identity) · v82: 계획은 제번+조 단위 */
  const _mp={job_no:job,
    process_code:jo,
    machining_completion_date:h.machining_completion_date||null,
    s1_date:h.s1_date||null};
  if(rowNo!=null)await MESDB.table('machining_plans').upsert({row_no:rowNo,..._mp},'row_no');
  else await MESDB.table('machining_plans').insertOne(_mp);
  /* v85: 체크가 하나도 없으면 화면의 부품 전체를 저장한다.
     (이전에는 헤더만 저장되고 machining_plan_parts 가 비어, 외주가공 발주가
      기준공정 1번을 임의로 붙여 나가는 사고가 났다) */
  let picks=[...document.querySelectorAll('#pbody input[type=checkbox]:checked')]
    .map(c=>Number(c.dataset.i)).filter(n=>!Number.isNaN(n));
  const allParts=!picks.length&&parts.length;
  if(allParts)picks=parts.map((_,k)=>k);
  if(picks.length){
   /* v39: 기존 행(row_no 보유)은 갱신, 신규 행은 row_no 없이 insert */
   const upd=[],ins=[];
   picks.forEach(k=>{const p=parts[k];
     const base={job_no:job,process_code:jo,part_no:p.part_no,part_name:p.part_name||null,
       standard_process:p.standard_process||null,steps:p.steps||[]};
     if(p.row_no!=null)upd.push({row_no:Number(p.row_no),...base});else ins.push(base)});
   if(upd.length)await MESDB.table('machining_plan_parts').upsert(upd,'row_no');
   if(ins.length)await MESDB.table('machining_plan_parts').upsert(ins);
   /* v85: 저장 여부를 직접 확인한다.
      RLS(anon 세션)로 INSERT 가 조용히 걸리면 오류 없이 0건이 되고,
      바로 뒤 loadParts 가 PartList 기본값을 다시 그려 '원복'된 것처럼 보인다. */
   const chk=await MESDB.table('machining_plan_parts')
     .select(`select=row_no&job_no=eq.${encodeURIComponent(job)}&process_code=eq.${encodeURIComponent(jo)}&limit=1`)
     .catch(()=>null);
   if(!chk||!chk.length)
    throw new Error('부품 공정이 DB에 반영되지 않았습니다. 로그아웃 후 다시 로그인해 주세요 '
                   +'(machining_plan_parts 의 INSERT 권한/RLS 확인).');
  }
  await loadParts(job,jo);
  msg(`${job} ${jo}조 가공계획을 저장했습니다.`+
      (picks.length?` (부품 ${picks.length}건 확정${allParts?' · 체크가 없어 전체 저장':''})`
                   :' 저장할 부품이 없습니다 — PartList를 먼저 등록하세요.'));
 }catch(e){msg('저장 실패: '+String(e.message||e).slice(0,140))}
}
async function del_(){
 const ids=[...document.querySelectorAll('#pbody input[type=checkbox]:checked')]
   .map(c=>Number(c.dataset.row)).filter(n=>!Number.isNaN(n));
 if(!ids.length)return msg('삭제할 부품 행을 선택하세요.');
 if(!_online())return msg('DB 미연결 상태에서는 삭제할 수 없습니다.');
 if(!confirm(`${ids.length}건을 삭제하시겠습니까?`))return;
 try{for(const id of ids)await MESDB.table('machining_plan_parts').delete({row_no:id});
  if(view[selIdx])await loadParts(view[selIdx].job_no,view[selIdx].jo);
  msg(`${ids.length}건을 삭제했습니다.`)}
 catch(e){msg('삭제 실패: '+String(e.message||e).slice(0,140))}
}
/* v46 가공계획서 인쇄: 선택 제번의 부품/공정을 실제 출력 */
function pr(){
 const h=view[selIdx];
 if(!h)return msg('인쇄할 제번을 목록에서 선택하세요.');
 const rs=parts.filter(p=>p.job_no===h.job_no);
 if(!rs.length)return msg('출력할 부품이 없습니다. PartList를 먼저 등록하세요.');
 const th=['순번','부품코드','부품명','기준공정'].concat(Array.from({length:10},(_,i)=>'공정'+(i+1)));
 const rows=rs.map((p,i)=>{const st=(p.steps||[]).slice(0,10);
   return [i+1,p.part_no,p.part_name||'',p.standard_process||''].concat(
     Array.from({length:10},(_,k)=>st[k]==null?'':(typeof st[k]==='object'?(st[k].process_code||st[k].code||''):st[k])))});
 const w=window.open('','_blank','width=1000,height=700');
 if(!w)return msg('팝업이 차단되었습니다. 브라우저 팝업 허용 후 다시 시도하세요.');
 w.document.write(`<!doctype html><meta charset="utf-8"><title>가공계획서 ${h.job_no}</title>
 <style>body{font-family:"Malgun Gothic",sans-serif;font-size:12px;padding:18px}
 h2{margin:0 0 6px;font-size:19px}table{border-collapse:collapse;width:100%;margin-top:8px}
 th,td{border:1px solid #444;padding:3px 5px;text-align:center}th{background:#eef2f6}
 .info td{text-align:left;border:0;padding:1px 0}@media print{body{padding:0}}</style>
 <h2>가공계획서</h2>
 <table class="info"><tr><td>제 번 : ${h.job_no}</td><td>공정(조) : ${h.jo}조 (${h.jo}/${h.set_qty})</td>
 <td>가공완료일 : ${h.machining_completion_date||''}</td><td>출력일 : ${new Date().toISOString().slice(0,10)}</td></tr></table>
 <table><thead><tr>${th.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>
 ${rows.map(r=>'<tr>'+r.map(c=>'<td>'+String(c??'')+'</td>').join('')+'</tr>').join('')}
 </tbody></table>`);
 w.document.close();w.focus();setTimeout(()=>w.print(),300);
 msg(`${h.job_no} 가공계획서 ${rs.length}건을 인쇄합니다.`);
}
window.MES={search,save,print:pr,del:del_,setMessage:msg,reload:()=>loadHeads()};render();
/* 기준정보 › 가공 기준공정관리에서 바뀌면 이 화면도 따라온다 */
(function(){const b=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(['standard_processes','standard_process_steps','machining_standard_routes'],()=>{if(typeof loadRoutes==='function')loadRoutes()});return true}return false};if(!b()){let n=0;const iv=setInterval(()=>{if(b()||++n>40)clearInterval(iv)},150)}})();

/* ── v39: 제번리스트=job_pool(수주), 기준공정=machining_standard_routes,
   부품=machining_plan_parts → 없으면 PartList 부품 × 기준공정 ── */
async function _waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}
async function loadRoutes(){
 try{const rs=await MESDB.table('machining_standard_routes').select('select=*&order=standard_process_no');
  routes.length=0;rs.forEach(r=>routes.push({row_no:r.row_no,standard_process_no:r.standard_process_no,
    standard_process_name:r.standard_process_name,steps:(Array.isArray(r.steps)?r.steps:[]).map(x=>
      x&&typeof x==='object'?(x.process_code||x.code||''):String(x||'')).filter(Boolean)}));
  renderRoutes();
 }catch(e){}
}
async function loadHeads(){
 await _waitDB();
 if(!(window.MESDB&&MESDB.online)){buildPickers();return msg('DB 미연결 - 제번리스트를 불러올 수 없습니다.')}
 await loadProcs();buildOpts();await loadRoutes();
 try{
  const [pool,plans]=await Promise.all([
    MESDB.table('job_pool').select('select=*&order=row_no'),
    MESDB.table('machining_plans').select('select=*')]);
  /* v82: 공정(조) — 제번을 수주의 공정(조)수만큼 1조,2조… 로 전개한다 */
  const JO=v=>window.MESJO?MESJO.norm(v):String(v??'').trim();
  const pm=new Map(plans.map(p=>[p.job_no+'|'+(JO(p.process_code)||'1'),p]));
  heads.length=0;let no=0;
  pool.forEach(r=>{const q=Math.max(1,Math.trunc(Number(r.set_qty))||1);
   for(let k=1;k<=q;k++){const jo=String(k);const p=pm.get(r.job_no+'|'+jo)||{};
    heads.push({row_no:++no,job_no:r.job_no,item_name:r.item_name||'',
      set_qty:q,jo,process_code:jo,plan_row:p.row_no??null,
      machining_completion_date:p.machining_completion_date||r.completion_date||'',
      s1_date:p.s1_date||r.s1_date||''})}});
  view=[...heads];render();buildPickers();loadRoutes();
  msg(heads.length?`제번·조 ${heads.length}건. 행을 선택하면 그 조의 부품별 가공공정이 표시됩니다.`
    :'등록된 수주가 없습니다. 영업관리 > 수주등록을 먼저 하세요.');
 }catch(e){msg('제번리스트 조회 실패: '+String(e.message||e).slice(0,110))}
}
/* ── v81: 가공 공정 리스트 인라인 편집 ────────────────────────────
 * 기준공정(machining_standard_routes)의 공정1~10을 그리드 안에서 드롭다운으로
 * 직접 고르고, 행 추가 / 저장 / 삭제까지 한 화면에서 처리한다. */
/* 아래 선언들은 상단 render() 최초 호출보다 늦게 평가되므로 var/함수선언(호이스팅)로 둔다 */
var RSEQN=10, routeIdx=-1, OPTS='<option value=""></option>';
function buildOpts(){
 OPTS='<option value=""></option>'+Object.keys(PROCN)
  .sort((a,b)=>String(PROCN[a]||a).localeCompare(String(PROCN[b]||b),'ko'))
  .map(c=>`<option value="${esc(c)}">${esc(PROCN[c])}</option>`).join('');
}
function routeName(a){const nm=(a||[]).filter(Boolean).map(c=>PROCN[c]||c);
 return nm.length?`${nm.join('·')} (${nm.length}공정)`.slice(0,80):''}
function RROW(r,i){return `<tr data-i="${i}" class="${r._dirty?'dirty':''}" onclick="pickRoute(${i})">`
 +`<td class="c pad0"><input type="checkbox" class="rchk" data-i="${i}" onclick="event.stopPropagation()" onchange="pickRouteChk(${i},this)"></td>`
 +`<td class="c">${esc(r.standard_process_no??'')}</td>`
 +`<td class="pad0"><input class="rname" data-i="${i}" value="${esc(r.standard_process_name||'')}" placeholder="자동생성" oninput="routeNameEdit(${i},this.value)" onclick="event.stopPropagation()"></td>`
 +Array.from({length:RSEQN},(_,k)=>`<td class="pad0"><select class="rsel" data-i="${i}" data-k="${k}" onchange="routeStep(${i},${k},this.value)" onclick="event.stopPropagation()">${OPTS}</select></td>`).join('')
 +`</tr>`}
function REMPTY(){return `<tr><td colspan="${RSEQN+3}" class="c" style="height:80px;color:#8a97a2">등록된 기준공정이 없습니다. [+ 행추가]로 공정순서를 만드세요.</td></tr>`}
function renderRoutes(){
 if(!window.rbody)return;
 rbody.innerHTML=routes.length?routes.map((r,i)=>RROW(r,i)).join(''):REMPTY();
 rbody.querySelectorAll('select.rsel').forEach(sl=>{
  const i=+sl.dataset.i,k=+sl.dataset.k;
  const v=((routes[i]||{}).steps||[])[k]||'';
  sl.value=v;
  if(v&&sl.value!==v){sl.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(pname(v))}</option>`);sl.value=v}
  sl.classList.toggle('on',!!v);
 });
 markRouteSel();
}
function markRouteSel(){if(!window.rbody)return;
 rbody.querySelectorAll('tr[data-i]').forEach(x=>x.classList.toggle('sel',+x.dataset.i===routeIdx))}
function rchkAll(el){rbody.querySelectorAll('input.rchk').forEach(c=>c.checked=el.checked);
 if(!el.checked){routeIdx=-1;markRouteSel()}}
/* v85: 기준공정 선택은 체크박스로 통일한다.
   여러 개를 체크해도 [공정삭제]는 그대로 동작하고,
   [부품에 적용]은 마지막에 체크한 행(또는 체크가 하나뿐이면 그 행)을 쓴다. */
function pickRouteChk(i,el){
 if(el&&el.checked){routeIdx=i;markRouteSel();
  const r=routes[i]||{},st=(r.steps||[]).filter(Boolean);
  msg(`기준공정 ${r.standard_process_no} 선택 · ${st.length?st.map(c=>PROCN[c]||c).join(' → '):'공정 없음'}`);
 }else if(routeIdx===i){routeIdx=-1;markRouteSel();msg('기준공정 선택을 해제했습니다.')}
}
/* 체크 상태에서 적용 대상 기준공정을 정한다 */
function routeForApply(){
 const on=[...rbody.querySelectorAll('input.rchk:checked')].map(c=>+c.dataset.i).filter(n=>!Number.isNaN(n));
 if(on.length===1)return on[0];
 if(on.includes(routeIdx))return routeIdx;
 if(on.length>1)return -2;
 return routeIdx;
}
function pickRoute(i){const r=routes[i];if(!r)return;routeIdx=i;markRouteSel();
 const st=(r.steps||[]).filter(Boolean);
 msg(`기준공정 ${r.standard_process_no} 선택 · ${st.length?st.map(c=>PROCN[c]||c).join(' → '):'공정 없음'}`);}
function routeStep(i,k,v){const r=routes[i];if(!r)return;
 const st=Array.from({length:RSEQN},(_,x)=>(r.steps||[])[x]||'');
 st[k]=String(v||'').trim();
 while(st.length&&!st[st.length-1])st.pop();
 r.steps=st;r._dirty=true;routeIdx=i;
 if(!r._nameEdited)r.standard_process_name=routeName(st);
 const tr=rbody.querySelector(`tr[data-i="${i}"]`);
 if(tr){tr.classList.add('dirty');
  const ni=tr.querySelector('.rname');if(ni&&!r._nameEdited)ni.value=r.standard_process_name;}
 const sl=rbody.querySelector(`select[data-i="${i}"][data-k="${k}"]`);if(sl)sl.classList.toggle('on',!!st[k]);
 markRouteSel();
 msg(`기준공정 ${r.standard_process_no} 공정${k+1} 변경 · [▤ 공정저장]을 눌러야 확정됩니다.`);}
function routeNameEdit(i,v){const r=routes[i];if(!r)return;
 r.standard_process_name=v;r._nameEdited=true;r._dirty=true;
 const tr=rbody.querySelector(`tr[data-i="${i}"]`);if(tr)tr.classList.add('dirty');}
function routeAdd(){
 const no=routes.reduce((m,r)=>Math.max(m,Number(r.standard_process_no)||0),0)+1;
 routes.push({row_no:null,standard_process_no:no,standard_process_name:'',steps:[],_dirty:true,_new:true});
 routeIdx=routes.length-1;renderRoutes();
 const tr=rbody.querySelector(`tr[data-i="${routeIdx}"]`);if(tr&&tr.scrollIntoView)tr.scrollIntoView({block:'nearest'});
 msg(`기준공정 ${no} 행을 추가했습니다. 공정을 고른 뒤 [▤ 공정저장]하세요.`);}
async function routeSave(){
 const tg=routes.filter(r=>r._dirty);
 if(!tg.length)return msg('변경된 기준공정이 없습니다.');
 if(!_online())return msg('DB 미연결 상태에서는 저장할 수 없습니다.');
 const bad=tg.find(r=>!(r.steps||[]).filter(Boolean).length);
 if(bad)return msg(`기준공정 ${bad.standard_process_no}: 공정을 하나 이상 선택하세요.`);
 try{
  const today=new Date().toISOString().slice(0,10);
  for(const r of tg){
   const st=(r.steps||[]).filter(Boolean);
   const id=Number(r.standard_process_no);
   const nm=(r.standard_process_name||'').trim()||routeName(st);
   /* 기준정보 › 가공 기준공정관리 와 같은 마스터에 저장한다 */
   await MESDB.table('standard_processes').upsert({standard_process_id:id,
     standard_process_name:nm,owner_name:r.owner_name||OWNER(),registered_date:today},'standard_process_id');
   await MESDB.table('standard_process_steps').delete({standard_process_id:id});
   if(st.length)await MESDB.table('standard_process_steps')
     .upsert(st.map((c,i)=>({standard_process_id:id,sequence:i+1,process_code:c})));
   await MESDB.table('machining_standard_routes')
     .upsert({standard_process_no:id,standard_process_name:nm,steps:st},'standard_process_no');
  }
  try{MESDB.notify&&MESDB.notify(['standard_processes','standard_process_steps','machining_standard_routes'])}catch(e){}
  await loadRoutes();
  msg(`기준공정 ${tg.length}건을 저장했습니다. (기준정보 › 가공 기준공정관리에도 반영)`);
 }catch(e){msg('기준공정 저장 실패: '+String(e.message||e).slice(0,140))}
}
async function routeDel(){
 const idx=[...rbody.querySelectorAll('input.rchk:checked')].map(c=>+c.dataset.i).filter(n=>!Number.isNaN(n));
 if(!idx.length)return msg('삭제할 기준공정 행을 체크하세요.');
 const ids=idx.map(i=>routes[i]).filter(r=>r&&!r._new).map(r=>Number(r.standard_process_no));
 if(ids.length&&!_online())return msg('DB 미연결 상태에서는 삭제할 수 없습니다.');
 if(!confirm(`기준공정 ${idx.length}건을 삭제하시겠습니까?`))return;
 try{
  for(const id of ids){
   await MESDB.table('standard_process_steps').delete({standard_process_id:id});
   await MESDB.table('standard_processes').delete({standard_process_id:id});
   await MESDB.table('machining_standard_routes').delete({standard_process_no:id});
  }
  try{MESDB.notify&&MESDB.notify(['standard_processes','standard_process_steps','machining_standard_routes'])}catch(e){}
  idx.slice().sort((a,b)=>b-a).forEach(i=>{if(routes[i]&&routes[i]._new)routes.splice(i,1)});
  routeIdx=-1;
  if(ids.length)await loadRoutes();else renderRoutes();
  msg(`기준공정 ${idx.length}건을 삭제했습니다.`);
 }catch(e){msg('기준공정 삭제 실패: '+String(e.message||e).slice(0,140))}
}
/* 선택한 기준공정의 공정순서를 부품(체크한 행, 없으면 전체)에 적용 */
async function applySeq(){
 const ri=routeForApply();
 if(ri===-2)return msg('기준공정이 여러 개 체크되어 있습니다. 적용할 하나만 남기세요.');
 const r=routes[ri];
 if(!r)return msg('가공 공정 리스트에서 적용할 기준공정을 체크하세요.');
 if(r._dirty)return msg('변경된 기준공정입니다. [▤ 공정저장] 후 적용하세요.');
 const seq=(r.steps||[]).filter(Boolean);
 if(!seq.length)return msg('공정이 비어 있는 기준공정입니다.');
 const job=(view[selIdx]&&view[selIdx].job_no)||(q_job.value||'').trim();
 if(!job)return msg('제번을 선택하세요.');
 if(!parts.length)return msg('적용할 부품이 없습니다. PartList를 먼저 등록하세요.');
 let idx=[...document.querySelectorAll('#pbody input[type=checkbox]:checked')]
   .map(c=>Number(c.dataset.i)).filter(n=>!Number.isNaN(n));
 if(!idx.length)idx=parts.map((_,k)=>k);
 idx.forEach(k=>{const p=parts[k];if(!p)return;p.steps=[...seq];p.standard_process=r.standard_process_name});
 pbody.innerHTML=parts.length?parts.map(PROW).join(''):PEMPTY;
 idx.forEach(k=>{const cb=document.querySelector(`#pbody input[data-i="${k}"]`);if(cb)cb.checked=true});
 msg(`부품 ${idx.length}건에 공정순서를 적용했습니다 — ${seq.map(c=>PROCN[c]||c).join(' → ')} · 기준공정 ${r.standard_process_no}. [▤ 저장]을 눌러야 확정됩니다.`);
}
let _partsTok=0;
async function loadParts(job,jo){
 const _tk=++_partsTok;
 jo=String(jo||(view[selIdx]&&view[selIdx].jo)||'1');
 parts.length=0;
 if(!(window.MESDB&&MESDB.online)){pbody.innerHTML=PEMPTY;return}
 try{
  const rs=await MESDB.table('machining_plan_parts')
    .select(`select=*&job_no=eq.${encodeURIComponent(job)}&process_code=eq.${encodeURIComponent(jo)}&order=row_no`);
  if(_tk!==_partsTok)return;
  if(rs.length){
   rs.forEach(r=>parts.push({row_no:r.row_no,job_no:job,part_no:r.part_no,part_name:r.part_name||'',
     standard_process:r.standard_process||'',steps:Array.isArray(r.steps)?r.steps:[]}));
  }else{
   const pl=await MESDB.table('partlist_materials')
     .select(`select=part_no,part_name,process_code&job_no=eq.${encodeURIComponent(job)}&order=row_no`)
     .then(a=>a.filter(x=>(window.MESJO?MESJO.norm(x.process_code):String(x.process_code||''))===jo));   /* 그 조의 PartList (옛 A,B,C 도 1,2,3 으로 읽음) */
   if(_tk!==_partsTok)return;
   const std=routes[0];
   pl.forEach(r=>parts.push({row_no:null,job_no:job,part_no:r.part_no,part_name:r.part_name||'',
     standard_process:std?std.standard_process_name:'',steps:std?std.steps:[]}));
  }
  pbody.innerHTML=parts.length?parts.map(PROW).join(''):PEMPTY;
  q_job.value=job;
 msg(`${job} ${jo}조 · 부품 ${parts.length}건${parts.some(p=>p.row_no==null)?' (PartList 기준 · 저장하면 가공계획으로 확정)':''}`);
 }catch(e){msg('부품 조회 실패: '+String(e.message||e).slice(0,110))}
}
