<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구매품 입고확정</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--head:#d8e7f3;--head2:#c8dbea;--blue:#2b73b5;--ink:#344758;--bg:#f3f6f8}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column;background:#fff}.title{height:48px;padding:10px 14px 5px;border-bottom:2px solid #3977ad}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title small{font-size:11px;color:#9aa5ae;margin-left:12px}
.filters{padding:7px 14px 8px;border-bottom:1px solid var(--line2);background:#fafbfc}.row{display:grid;grid-template-columns:90px minmax(160px,1fr) 70px 140px 70px minmax(150px,1fr) 70px 100px;gap:5px;align-items:center}.row+.row{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}.gridbox{flex:1;min-height:0;margin:0 14px;border:1px solid var(--line);display:flex;flex-direction:column;background:white}.grid-title{height:28px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1320px;width:100%;table-layout:fixed}th,td{height:26px;padding:0 6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}.check{width:42px}.no{width:52px}.job{width:105px}.item{width:145px}.proc{width:58px}.procname{width:90px}.part{width:100px}.partname{width:145px}.mat{width:70px}.vendor{width:95px}.date{width:92px}.price{width:95px}.rate{width:76px}.status{width:80px}
.filterbar{height:29px;margin:0 14px;display:flex;align-items:center;border:1px solid var(--line);border-top:0;background:#f6f8fa;padding:0 7px;color:#657482;gap:8px}.filterbar .x{color:#768591}.summary{height:51px;margin:0 14px;border:1px solid var(--line);border-top:0;background:#eef3f6;display:flex;align-items:center;gap:7px;padding:6px}.summary label{font-weight:700}.summary input,.summary select{height:28px;border:1px solid #aeb9c3;background:#fff;padding:0 6px}.summary .money{width:150px;text-align:right}.summary .rateinput{width:85px;text-align:right}.summary .dateinput{width:125px}.btn{height:29px;min-width:72px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn.warn{color:#a63a2f}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.confirm{background:linear-gradient(#fff3f7,#f3c3d5);color:#a8235a;border-color:#d38aa6;font-weight:700}.btn.confirm:hover{background:linear-gradient(#fff,#f7d3e0)}.spacer{flex:1}.foot{height:43px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.row{grid-template-columns:80px 1fr 70px 1fr}.row .wide-hide{display:none}.summary{overflow:auto}.title h1{font-size:19px}}
.title{display:flex;align-items:center;gap:14px}.opts{display:flex;gap:14px;align-items:center;color:#41505c;font-size:13px}.opts label{display:flex;align-items:center;gap:4px;cursor:pointer}

/* v249: 확정가 직접 입력 */
input.fixin{width:100%;height:20px;border:1px solid #cbd4dc;padding:0 3px;text-align:right;font:inherit}input.fixin.man{background:#fff8e1;border-color:#e0b64a}
.summary .fixbulk{width:110px;text-align:right}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>구매품 입고확정 <small>입고 대기 구매품을 선택해 확정 처리합니다.</small></h1>
    <div class="opts"><label><input type="radio" name="done" value="미완료" checked onchange="search()"> 미완료</label><label><input type="radio" name="done" value="완료" onchange="search()"> 완료</label></div>
  </div>
  <section class="filters">
    <div class="row">
      <div class="label">협력업체</div><input id="vendorQ" class="field" placeholder="협력업체">
      <div class="label">제번</div><input id="jobQ" class="field" placeholder="제번">
      <div class="label">품명</div><input id="itemQ" class="field" placeholder="품명">
      <div class="label wide-hide">공장</div><select id="plantQ" class="field wide-hide"><option>1공장</option><option>2공장</option></select>
    </div>
  </section>
  <div class="gridbox">
    <div class="grid-title">입고 확정 대기리스트</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th class="no">No</th><th class="check">선택</th><th class="job">제번</th><th class="item">품명</th><th class="proc">공정</th><th class="procname">공정명</th><th class="part">품번</th><th class="partname">부품명</th><th class="mat">재질</th><th class="vendor">협력업체</th><th class="date">발주일</th><th class="date">입고일</th><th class="date">입고확정일</th><th class="price">매입가</th><th class="rate">네고율(%)</th><th class="price">확정가</th><th class="status">상태</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
  <div class="filterbar"><span class="x">×</span><span id="filterText">Starts with([네고율(%)], '10.00')</span></div>
  <div class="summary">
    <label>견적가 합계</label><input id="total" class="money" readonly>
    <label>네고율</label><input id="nego" class="rateinput" type="number" step="0.01" value="10.00"><button class="btn" onclick="applyNego()">네고율 적용</button>
    <label>확정가</label><input id="fixBulk" class="fixbulk" inputmode="numeric" placeholder="선택 행 일괄" title="선택한 행에 같은 확정가를 넣습니다 (행마다 표의 확정가 칸에서 따로 입력해도 됩니다)"><button class="btn" onclick="applyFix()">확정가 적용</button>
    <label>입고확정일</label><input id="confirmDate" class="dateinput" type="date"><button class="btn confirm" onclick="confirmSelected()">▣ 입고확정</button>
    <div class="spacer"></div><span id="selectedText">선택 0건</span>
  </div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn warn" onclick="cancelConfirm()" title="확정된 건은 위쪽 [완료]로 조회한 뒤 고르세요">✖ 입고확정취소</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">입고 확정 대기 데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
function money(v){return Number(v||0).toLocaleString('ko-KR')}
/* v39: PostgREST numeric 은 문자열/NULL 로 오므로 반드시 숫자화 (rate.toFixed 크래시 방지) */
function num(v){const x=Number(v);return Number.isFinite(x)?x:0}
function pct(v){return num(v).toFixed(2)}
/* v249: 확정가는 직접 입력이 우선 (r.fixManual) */
function finalPrice(r){return r.fixManual!=null?num(r.fixManual):Math.round(num(r.price)*(1-num(r.rate)/100))}
function setFix(id,v){const r=rows.find(x=>x.id===id);if(!r)return;const n=Number(String(v||'').replace(/[^0-9.\-]/g,''));
 if(v===''||!Number.isFinite(n)){r.fixManual=null}else{r.fixManual=Math.round(n);if(num(r.price)>0)r.rate=Number(((1-r.fixManual/num(r.price))*100).toFixed(2))}
 render();const cb=document.querySelector(`#body input[data-id="${id}"]`);if(cb)cb.checked=true;summary();
 msg(r.fixManual!=null?`${r.part} 확정가를 ${money(r.fixManual)}원으로 입력했습니다.`:`${r.part} 확정가를 네고율 계산값으로 되돌렸습니다.`)}
function applyFix(){const s=selectedRows();if(!s.length)return msg('확정가를 적용할 행을 선택하세요.');const n=Math.round(Number(String(fixBulk.value||'').replace(/[^0-9.\-]/g,'')));
 if(!Number.isFinite(n)||n<0)return msg('확정가를 숫자로 입력하세요.');
 s.forEach(r=>{r.fixManual=n;if(num(r.price)>0)r.rate=Number(((1-n/num(r.price))*100).toFixed(2))});render();s.forEach(r=>{const cb=document.querySelector(`#body input[data-id="${r.id}"]`);if(cb)cb.checked=true});summary();
 msg(`${s.length}건에 확정가 ${money(n)}원을 적용했습니다.`)}
function render(){body.innerHTML=view.map((r,i)=>`<tr data-id="${r.id}" onclick="selectRow(event,${r.id})"><td class="c">${r.id}</td><td class="c"><input type="checkbox" data-id="${r.id}" onchange="summary()"></td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}</td><td>${r.partName}</td><td class="c">${r.mat}</td><td>${r.vendor}</td><td class="c">${r.order}</td><td class="c">${r.inDate}</td><td class="c">${r.confirm}</td><td class="r">${money(num(r.price))}</td><td class="r">${pct(r.rate)}</td><td class="r">${r.status==='확정'?money(finalPrice(r)):`<input class="fixin${r.fixManual!=null?' man':''}" value="${finalPrice(r)||''}" placeholder="0" onclick="event.stopPropagation()" onfocus="this.select()" onchange="setFix(${r.id},this.value)" title="확정가 직접 입력 — 비우면 매입가×(1-네고율) 로 돌아갑니다">`}</td><td class="c">${r.status}</td></tr>`).join('');countText.textContent=`${view.length}건`;summary()}
function selectedRows(){const ids=[...document.querySelectorAll('#body input:checked')].map(x=>Number(x.dataset.id));return rows.filter(r=>ids.includes(r.id))}
function selectRow(e,id){if(e.target.tagName==='INPUT')return;const cb=document.querySelector(`#body input[data-id="${id}"]`);if(cb){cb.checked=!cb.checked;summary()}}
function summary(){const s=selectedRows();total.value=money(s.reduce((a,r)=>a+(Number(r.price)||0),0));selectedText.textContent=`선택 ${s.length}건`;document.querySelectorAll('#body tr').forEach(tr=>tr.classList.toggle('sel',!!tr.querySelector('input:checked')))}
/* 미완료 = 아직 확정 안 된 입고 건, 완료 = 확정된 건. 확정 후에는 대기리스트에서 빠진다. */
function doneMode(){const e=document.querySelector('input[name=done]:checked');return e?e.value:'미완료'}
function search(){const v=vendorQ.value.trim().toLowerCase(),j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),m=doneMode();view=rows.filter(r=>(m==='완료'?r.status==='확정':r.status!=='확정')&&(!v||String(r.vendor||'').toLowerCase().includes(v))&&(!j||String(r.job||'').toLowerCase().includes(j))&&(!it||String(r.item||'').toLowerCase().includes(it)));render();msg(`${m} 기준 ${view.length}건을 조회했습니다.`)}
function applyNego(){const s=selectedRows();if(!s.length)return msg('네고율을 적용할 행을 선택하세요.');const rate=Math.max(0,Math.min(100,Number(nego.value)||0));s.forEach(r=>{r.rate=rate;r.fixManual=null});filterText.textContent=`Starts with([네고율(%)], '${rate.toFixed(2)}')`;render();s.forEach(r=>{const cb=document.querySelector(`#body input[data-id="${r.id}"]`);if(cb)cb.checked=true});summary();msg(`${s.length}건에 네고율 ${rate.toFixed(2)}%를 적용했습니다.`)}
let dirty=false;   /* v62 */
/* v96: [입고확정] = 즉시 DB 반영. 확정된 행은 미완료 목록에서 빠지고 완료 팝업이 뜬다 ([완료] 로 조회하면 다시 보임, 확정취소 가능). DB 미연결이면 종전처럼 화면만 바꾸고 [저장] 으로 반영. */
async function confirmSelected(){const s=selectedRows();if(!s.length)return msg('입고확정할 행을 선택하세요.');const d=confirmDate.value||new Date().toISOString().slice(0,10);
 s.forEach(r=>{r.confirm=d;r.status='확정';r.fix=finalPrice(r)});dirty=true;
 if(!window.MESDB||!MESDB.online){render();return msg(`${s.length}건을 ${d} 기준으로 입고확정했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('입고확정 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('입고확정 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;search();
 const okm=`${s.length}건을 ${d} 기준으로 입고확정했습니다.`;
 /* v116: 입고확정 완료 팝업을 직접 띄운다 (상태줄 감시에만 의존하지 않음) */
 try{(window.MESPOP||window.parent?.MESPOP)?.ok(okm+'\n'+[...new Set(s.map(r=>r.part).filter(Boolean))].slice(0,8).join(', '),'입고확정 완료')}catch(e){}
 msg(okm+` (DB 저장 완료${doneMode()==='완료'?'':' - 미완료 목록에서 제외'})`)}
/* v136: 입고확정취소 — 고르고 누르면 바로 DB 에 반영한다 ([저장]을 따로 누르지 않아도 된다).
   확정된 건은 「완료」로 조회하면 목록에 나온다. */
async function cancelConfirm(){
 const s=selectedRows();
 if(!s.length)return msg('확정취소할 행을 선택하세요. (확정된 건은 위쪽 [완료]로 조회하면 나옵니다)');
 const t=s.filter(r=>r.status==='확정'||r.confirm);
 if(!t.length)return msg('선택한 행 중 입고확정된 건이 없습니다. [완료]로 조회해 확정된 행을 고르세요.');
 const list=[...new Set(t.map(r=>`${r.job} ${r.part||''}`))].slice(0,8).join('\n · ');
 if(!confirm(`입고확정 ${t.length}건을 취소합니다.\n\n · ${list}${t.length>8?'\n … 외 '+(t.length-8)+'건':''}\n\n`
   +`입고확정일과 확정가가 지워지고 「입고」 상태로 돌아갑니다. 계속할까요?`))return;
 t.forEach(r=>{r.confirm='';r.status='입고';r.fix='';r.fixManual=null});dirty=true;
 if(!window.MESDB||!MESDB.online){render();return msg(`${t.length}건의 입고확정을 취소했습니다. (DB 미연결 - 로컬, [저장]으로 반영)`)}
 msg('확정취소 반영 중…');
 try{await MESDB.syncLines()}catch(e){}
 let rl=0;try{rl=MESDB.reloadLines?await MESDB.reloadLines():0}catch(e){rl=-1}
 if(rl===-1){render();return msg('확정취소 저장 실패: DB 반영이 되지 않았습니다. [저장]을 다시 눌러주세요.')}
 dirty=false;search();
 msg(`입고확정 ${t.length}건을 취소했습니다. (「입고」 상태로 복귀 · DB 저장 완료)`);
}
async function save(){const done=rows.filter(r=>r.status==='확정').length;
 if(!done&&dirty&&window.MESDB&&MESDB.online){try{await MESDB.syncLines();dirty=false;return msg('입고확정 취소 내용을 DB에 반영했습니다.')}catch(e){return msg('저장 실패: '+String(e.message||e).slice(0,140))}}
 if(!done){alert('확정 처리된 행이 없습니다.\n\n행을 선택하고 확정 처리한 뒤 [저장]을 눌러주세요.');return msg('저장할 확정 내역이 없습니다.')}if(!window.MESDB||!MESDB.online)return msg('구매품 입고확정 변경사항을 저장했습니다. (DB 미연결 - 로컬)');try{rows.forEach(r=>{if(r.status==='확정')r.fix=finalPrice(r)});await MESDB.syncLines();dirty=false;const n=rows.filter(r=>r.status==='확정').length;msg(`구매품 입고확정을 DB에 저장했습니다. 확정 ${n}건`)}catch(e){msg('저장 실패: '+e.message.slice(0,140))}}
function add(){msg('이 화면은 입고 대기자료를 확정하는 화면이므로 신규추가는 사용하지 않습니다.')}
function remove(){cancelConfirm()}
function exportCsv(){const out=[['제번','품명','공정','공정명','품번','부품명','재질','협력업체','발주일','입고일','입고확정일','매입가','네고율','확정가','상태'],...view.map(r=>[r.job,r.item,r.proc,r.procName,r.part,r.partName,r.mat,r.vendor,r.order,r.inDate,r.confirm,r.price,r.rate,finalPrice(r),r.status])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='purchase_receipt_confirmation.csv';a.click();URL.revokeObjectURL(a.href);msg('CSV 파일을 생성했습니다.')}
function msg(t){message.textContent=t}
confirmDate.value=new Date().toISOString().slice(0,10);window.MES={search,add,delete:remove,save,exportCsv,setMessage:msg};render();
</script>
<script src="mes_sample.js?v=169"></script><script src="mes_scene.js?v=67"></script><script src="mes_demo.js?v=67"></script><script src="mes_db.js?v=171"></script>
<script>MESDB.lines({page:"purchase_receipt_confirmation",category:"구매품",statuses:["입고", "입고확정"],map:{"id": {"col": "line_id", "type": "num"}, "vendor": "vendor_name", "job": "job_no", "item": "item_name", "proc": "process_code", "procName": "process_name", "part": "part_no", "partName": "part_name", "mat": "material", "order": {"col": "order_date", "type": "date"}, "inDate": {"col": "receipt_date", "type": "date"}, "confirm": {"col": "confirm_date", "type": "date"}, "price": {"col": "quote_price", "type": "num"}, "rate": {"col": "nego_rate", "type": "num"}, "fix": {"col": "confirm_price", "type": "num"}, "status": {"col": "status", "type": "status"}},get:()=>rows,render:()=>{search()}});</script>
<script src="mes_ctx.js?v=169"></script>
<script>
function sampleFill(){
  if(window.MESDEMO)return MESDEMO.run('purchase_receipt_confirmation',{});
  var e=document.getElementById('message'); if(e)e.textContent='예제 모듈을 불러오지 못했습니다.';
}
</script>
</body>
</html>
