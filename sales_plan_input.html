<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>제작계획등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
select.field{padding:0 2px}
/* v68 콤보: 직접 입력 + 목록 선택 둘 다 되는 칸 (input + datalist) */
.cbo{background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0h10L5 6z' fill='%23708090'/%3E%3C/svg%3E") no-repeat right 6px center;padding-right:18px}
.cbo::-webkit-calendar-picker-indicator{opacity:0;width:16px;margin-right:-16px;cursor:pointer}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.blk{margin:0 14px 8px;border:1px solid var(--line);background:#fff}
.bt{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.gg{display:grid;gap:5px;padding:8px 9px;align-items:center}
.g4{grid-template-columns:repeat(4,74px minmax(110px,1fr))}
.g3{grid-template-columns:64px repeat(3,1fr)}
.lb{font-weight:700;text-align:right;padding-right:3px}
.amt{display:grid;grid-template-columns:64px repeat(8,1fr);gap:4px;padding:8px 9px;align-items:end}
.amt .hd{text-align:center;font-weight:700;font-size:11px;color:#4b5c6a;padding-bottom:2px}
.amt input{width:100%;height:26px;border:1px solid #b5c0c9;text-align:right;padding:0 5px}
.pct{font-size:11px;color:#5d6d7b;text-align:right}
.chk{display:flex;align-items:center;gap:3px;white-space:nowrap}
.chk.src{gap:8px}.chk.src label{display:flex;align-items:center;gap:2px;cursor:pointer}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
.gg .hd{font-size:11px;color:#7c8a96;text-align:center;align-self:end;padding-bottom:1px}
</style></head><body><div class="screen">
<div class="title"><h1>제작계획등록</h1><small>제작계획</small></div>
<div class="blk"><div class="bt">기본정보</div><div class="gg g4">

</div></div>
<div class="blk"><div class="bt">기간</div><div class="gg" style="grid-template-columns:56px 132px 12px 132px 54px 118px 218px 48px minmax(160px,220px) 138px 1fr">
 <div></div><div class="hd">시작일</div><div></div><div class="hd">종료일</div><div class="hd">일수</div><div class="hd">구분</div><div class="hd">담당자</div><div class="hd" title="한 세트(조수 전체)를 통째로 맡기는 경우">세트</div><div class="hd">외주업체</div><div class="hd">Try-Out 예정일</div><div></div>
 <div class="lb">설 계</div><input id="design_start_date" type="date" class="field"><div class="c">~</div><input id="design_end_date" type="date" class="field"><input id="design_days" class="field c" placeholder="일수" title="소요일수 (종료일-시작일+1, 자동 계산)"><div class="chk src" title="사내 작업인지 외주(협력업체)인지 선택합니다."><label><input type="radio" name="design_src" value="사내" checked>사내</label><label><input type="radio" name="design_src" value="외주">외주</label></div><div class="chk"><span class="lb" style="width:52px">담당자</span><input id="design_manager" class="field cbo" list="dl_emp" autocomplete="off" style="width:160px" placeholder="입력 또는 선택"></div><div class="chk" style="justify-content:center"><input type="checkbox" id="design_set_outsourced" title="세트(조수 전체) 외주"></div><input id="design_vendor" class="field cbo" list="dl_vd_design" autocomplete="off" placeholder="외주 선택 시" disabled><input id="design_tryout_date" type="date" class="field" title="이 단계의 Try-Out 예정일 (비우면 기본정보 Try-Out 예정일)"><div></div>
 <div class="lb">가 공</div><input id="machining_start_date" type="date" class="field"><div class="c">~</div><input id="machining_end_date" type="date" class="field"><input id="machining_days" class="field c" placeholder="일수" title="소요일수 (자동 계산)"><div class="chk src" title="사내 작업인지 외주(협력업체)인지 선택합니다."><label><input type="radio" name="machining_src" value="사내" checked>사내</label><label><input type="radio" name="machining_src" value="외주">외주</label></div><div class="chk"><span class="lb" style="width:52px">담당자</span><input id="machining_manager" class="field cbo" list="dl_emp" autocomplete="off" style="width:160px" placeholder="입력 또는 선택"></div><div class="chk" style="justify-content:center"><input type="checkbox" id="machining_set_outsourced" title="세트(조수 전체) 외주"></div><input id="machining_vendor" class="field cbo" list="dl_vd_mach" autocomplete="off" placeholder="외주 선택 시" disabled><input id="machining_tryout_date" type="date" class="field" title="이 단계의 Try-Out 예정일 (비우면 기본정보 Try-Out 예정일)"><div></div>
 <div class="lb">조 립</div><input id="assembly_start_date" type="date" class="field"><div class="c">~</div><input id="assembly_end_date" type="date" class="field"><input id="assembly_days" class="field c" placeholder="일수" title="소요일수 (자동 계산)"><div class="chk src" title="사내 작업인지 외주(협력업체)인지 선택합니다."><label><input type="radio" name="assembly_src" value="사내" checked>사내</label><label><input type="radio" name="assembly_src" value="외주">외주</label></div><div class="chk"><span class="lb" style="width:52px">담당자</span><input id="assembly_manager" class="field cbo" list="dl_emp" autocomplete="off" style="width:160px" placeholder="입력 또는 선택"></div><div class="chk" style="justify-content:center"><input type="checkbox" id="assembly_set_outsourced" title="세트(조수 전체) 외주"></div><input id="assembly_vendor" class="field cbo" list="dl_vd_asm" autocomplete="off" placeholder="외주 선택 시" disabled><input id="assembly_tryout_date" type="date" class="field" title="이 단계의 Try-Out 예정일 (비우면 기본정보 Try-Out 예정일)"><div></div>
</div></div>
<div class="blk"><div class="bt">금액</div>
 <div class="gg" style="grid-template-columns:56px 1fr 64px 1fr 64px 1fr 72px 1fr">
  <div class="lb">수주가</div><input id="order_price" class="field num" oninput="recalc()"><div class="lb">목표가</div><input id="target_price" class="field num" readonly title="아래 8개 금액의 합계 (자동)"><div class="lb">이익금</div><input id="profit_amount" class="field num" readonly title="수주가 − 목표가 (자동)"><div class="lb">이익률(%)</div><input id="profit_rate_pct" class="field num" readonly title="이익금 ÷ 수주가 (자동)">
 </div>
 <div class="amt">
  <div></div><div class="hd">설계 사내</div><div class="hd">설계 사외</div><div class="hd">원재료</div><div class="hd">구매</div><div class="hd">가공 사내</div><div class="hd">가공 사외</div><div class="hd">조립 사내</div><div class="hd">조립 사외</div>
  <div class="lb">금 액</div>
  <div><input id="a1" oninput="recalc()"><div class="pct" id="p1">0%</div></div>
  <div><input id="a2" oninput="recalc()"><div class="pct" id="p2">0%</div></div>
  <div><input id="a3" oninput="recalc()"><div class="pct" id="p3">0%</div></div>
  <div><input id="a4" oninput="recalc()"><div class="pct" id="p4">0%</div></div>
  <div><input id="a5" oninput="recalc()"><div class="pct" id="p5">0%</div></div>
  <div><input id="a6" oninput="recalc()"><div class="pct" id="p6">0%</div></div>
  <div><input id="a7" oninput="recalc()"><div class="pct" id="p7">0%</div></div>
  <div><input id="a8" oninput="recalc()"><div class="pct" id="p8">0%</div></div>
 </div>
</div>
<footer class="foot"><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="sampleFill()" title="예시값을 순서대로 채우며 등록요점을 설명합니다.">▶ 등록예제</button><button class="btn" onclick="clearForm()">✕ 삭제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번을 입력하거나 목록에서 고르면 수주정보가 자동으로 채워집니다.</span></footer>
</div>
<datalist id="dl_job"></datalist><datalist id="dl_cust"></datalist><datalist id="dl_item"></datalist><datalist id="dl_mold"></datalist><datalist id="dl_emp"></datalist><datalist id="dl_vd_design"></datalist><datalist id="dl_vd_mach"></datalist><datalist id="dl_vd_asm"></datalist>
<script src="mes_lookup.js?v=68"></script><script>
/* v68: 제번·고객사·아이템·금형타입·담당자를 기준정보 드롭다운으로 (하드코딩 seed 제거) */
const AK=['design_internal_amount','design_external_amount','raw_material_amount','purchase_amount','machining_internal_amount','machining_external_amount','assembly_internal_amount','assembly_external_amount'];
const num=v=>Number(String(v??'').replace(/[^0-9.-]/g,''))||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* select 에 값을 넣는다. 목록에 없는 값(옛 자료·수주정보 텍스트)이면 옵션을 추가해 유지한다 */
/* v68 사내/외주 라디오 */
const isOut=k=>(document.querySelector(`input[name="${k}_src"]:checked`)||{}).value==='외주';
const setOut=(k,v)=>{const r=document.querySelector(`input[name="${k}_src"][value="${v===true?'외주':'사내'}"]`);if(r)r.checked=true;vendorGate(k)};
/* 외주일 때만 외주업체 입력 가능. 사내로 바꾸면 업체는 비운다 */
function vendorGate(k){const out=isOut(k),v=document.getElementById(k+'_vendor');if(!v)return;
 v.disabled=!out;if(!out)v.value='';v.placeholder=out?'입력 또는 선택':'외주 선택 시';
 const box=v.__mescbBox;if(box){box.inp.disabled=!out;box.inp.placeholder=v.placeholder;if(!out)box.inp.value=''}}
['design','machining','assembly'].forEach(k=>document.querySelectorAll(`input[name="${k}_src"]`).forEach(r=>r.addEventListener('change',()=>vendorGate(k))));
/* 모든 입력칸이 input(+datalist) 이라 목록에 없는 값도 그대로 유지된다 */
function setSel(id,v){const el=typeof id==='string'?document.getElementById(id):id;if(el)el.value=v==null?'':String(v)}
function recalc(){
 let s=0;for(let i=1;i<=8;i++)s+=num(document.getElementById('a'+i).value);
 target_price.value=s?fmt(s):'';
 for(let i=1;i<=8;i++){const a=num(document.getElementById('a'+i).value);
  document.getElementById('p'+i).textContent=(s?(a/s*100):0).toFixed(0)+'%';}
 const op=num(order_price.value);
 profit_amount.value=op||s?fmt(op-s):'';
 profit_rate_pct.value=op?((op-s)/op*100).toFixed(1):'';
 profit_amount.style.color=profit_rate_pct.style.color=(op&&op-s<0)?'#c62828':'';
}
order_price.addEventListener('blur',()=>{const v=num(order_price.value);order_price.value=v?fmt(v):''});
/* 일수 = 종료일 − 시작일 + 1 */
function calcDays(p){
 const s=document.getElementById(p+'_start_date').value,e=document.getElementById(p+'_end_date').value,d=document.getElementById(p+'_days');
 if(s&&e){const n=Math.round((new Date(e)-new Date(s))/86400000)+1;d.value=n>0?n:''}else d.value='';
}
['design','machining','assembly'].forEach(p=>['_start_date','_end_date'].forEach(k=>document.getElementById(p+k).addEventListener('change',()=>calcDays(p))));

function load(o){
 for(const k of ['job_no','customer_name','item_name','mold_type_name','product_name','process_set_qty','order_date','model','s1_planned_date','delivery_planned_date','design_start_date','design_end_date','design_days','design_manager','machining_start_date','machining_end_date','machining_manager','assembly_start_date','assembly_end_date','assembly_manager','order_price','target_price',
   'design_vendor','design_tryout_date','machining_vendor','machining_tryout_date','assembly_vendor','assembly_tryout_date']){
  setSel(k,o[k]);
 }
 ['design','machining','assembly'].forEach(k=>{const c=document.getElementById(k+'_set_outsourced');if(c)c.checked=!!o[k+'_set_outsourced']});
 setOut('design',o.design_outsourced);setOut('machining',o.machining_outsourced);setOut('assembly',o.assembly_outsourced);
 ['design','machining','assembly'].forEach(k=>{const v=document.getElementById(k+'_vendor');if(v&&o[k+'_vendor'])v.value=o[k+'_vendor']});
 AK.forEach((k,i)=>{const n=document.getElementById('a'+(i+1));if(n)n.value=o[k]??''});
 ['design','machining','assembly'].forEach(p=>{if(!document.getElementById(p+'_days').value)calcDays(p)});
 order_price.value=num(order_price.value)?fmt(num(order_price.value)):'';
 recalc();
}
function clearForm(quiet){
 document.querySelectorAll('input').forEach(n=>{if(n.type==='checkbox')n.checked=false;else if(n.type!=='radio')n.value=''});
 ['design','machining','assembly'].forEach(k=>setOut(k,false));
 recalc();if(!quiet)message.textContent='입력값을 비웠습니다.';
}
/* v28: 영업계획을 sales_plans 테이블에 실제 저장 + 수주정보 연동 */
const PCT={design_internal_amount:'design_internal_pct',design_external_amount:'design_external_pct',
 raw_material_amount:'raw_material_pct',purchase_amount:'purchase_pct',
 machining_internal_amount:'machining_internal_pct',machining_external_amount:'machining_external_pct',
 assembly_internal_amount:'assembly_internal_pct',assembly_external_amount:'assembly_external_pct'};
const HK=['job_no','product_name','customer_name','process_set_qty','item_name','order_date',
 'mold_type_name','s1_planned_date','model','delivery_planned_date','design_start_date','design_end_date',
 'design_days','design_manager','machining_start_date','machining_end_date','machining_manager',
 'assembly_start_date','assembly_end_date','assembly_manager','order_price','target_price',
 'design_vendor','design_tryout_date','machining_vendor','machining_tryout_date','assembly_vendor','assembly_tryout_date'];
const DATEK=['order_date','s1_planned_date','delivery_planned_date','design_start_date','design_end_date',
 'machining_start_date','machining_end_date','assembly_start_date','assembly_end_date','design_tryout_date','machining_tryout_date','assembly_tryout_date'];
const NUMK=['process_set_qty','design_days','order_price','target_price'];
const online=()=>!!(window.MESDB&&MESDB.online);
const msg=t=>message.textContent=t;
async function waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}

function collect(){
 const o={};
 HK.forEach(k=>{const n=document.getElementById(k);o[k]=n?(n.value||null):null});
 NUMK.forEach(k=>{o[k]=o[k]==null?null:(num(o[k])||null)});
 DATEK.forEach(k=>{if(o[k]==='')o[k]=null});
 o.design_outsourced=isOut('design');
 o.machining_outsourced=isOut('machining');
 o.assembly_outsourced=isOut('assembly');
 ['design','machining','assembly'].forEach(k=>{o[k+'_set_outsourced']=!!document.getElementById(k+'_set_outsourced').checked;
  if(!o[k+'_outsourced'])o[k+'_vendor']=null});
 let s=0;AK.forEach((k,i)=>s+=num(document.getElementById('a'+(i+1)).value));
 AK.forEach((k,i)=>{const a=num(document.getElementById('a'+(i+1)).value);
  o[k]=a||null;o[PCT[k]]=s?Math.round(a/s*1000)/10:0});
 o.target_price=s||null;
 const op=num(order_price.value);
 o.profit_rate_pct=op?Math.round((op-s)/op*1000)/10:null;
 return o;
}

/* ── v68 기준정보 드롭다운 ──────────────────────────────
 * 제번: job_pool(취소 제외 수주) / 고객사: 업체관리 고객사 / 아이템·금형타입: 기준정보 / 담당자: 사용자정보 */
function fillDL(id,rows,val,lab){
 const dl=document.getElementById(id);if(!dl)return;
 dl.innerHTML=rows.map(r=>{const v=val(r);if(!v)return '';const l=lab?lab(r):'';
  return `<option value="${esc(v)}">${esc(l)}</option>`}).join('');
}
async function loadMasters(){
 await waitDB();if(!online()){msg('DB 미연결 - 기준정보를 불러올 수 없습니다.');return}
 try{
  const rs=await MESDB.table('job_pool').select('select=job_no,item_name,customer_name,order_date&order=row_no');
  fillDL('dl_job',rs,r=>r.job_no,r=>[r.item_name,r.customer_name].filter(Boolean).join(' · '));
  job_no.placeholder=rs.length?`제번 입력/선택 (등록 ${rs.length}건)`:'등록된 수주가 없습니다';
 }catch(e){}
 const K=window.MESLOOK;if(!K)return;
 const pull=async kind=>{try{return await K.rows(kind)}catch(e){return []}};
 fillDL('dl_cust',await pull('customer'),r=>r.vendor_name,r=>r.vendor_code||'');
 fillDL('dl_item',await pull('item'),r=>r.item_name,r=>r.item_code||'');
 fillDL('dl_mold',await pull('mold'),r=>r.mold_type_name,r=>r.mold_type_code||'');
 fillDL('dl_emp',await pull('employee'),r=>r.name,r=>r.department_name||'');
 /* 외주업체: 설계=외주설계 협력업체, 가공=외주가공 협력업체, 조립=협력업체 전체 */
 fillDL('dl_vd_design',await pull('design_partner'),r=>r.partner_name,r=>'외주설계');
 fillDL('dl_vd_mach',await pull('vendor_outsourcing'),r=>r.vendor_name,r=>r.vendor_code||'');
 fillDL('dl_vd_asm',(await pull('vendor')).filter(r=>r.vendor_type==='협력업체'),r=>r.vendor_name,r=>r.vendor_code||'');
 ['design','machining','assembly'].forEach(vendorGate);
}

/* 기준정보·수주가 바뀌면 목록만 다시 채운다 (입력값은 그대로 유지) */
(function(){const bind=()=>{if(window.MESDB&&MESDB.onChange){MESDB.onChange(['sale_orders','jobs','vendors','item_categories','mold_types','users'],()=>{loadMasters()});return true}return false};
 if(!bind()){let n=0;const iv=setInterval(()=>{if(bind()||++n>40)clearInterval(iv)},100)}})();

/* 제번 선택 → 기존 계획 우선, 없으면 수주정보(sale_orders)로 헤더 채움 */
async function loadJob(j){
 if(typeof j==='string'&&j)setSel('job_no',j);
 const job=(job_no.value||'').trim();if(!job){clearForm(true);msg('제번을 입력하거나 목록에서 고르세요.');return}
 if(!online()){msg('DB 미연결 - 수주정보를 불러올 수 없습니다.');return}
 try{
  const ex=await MESDB.table('sales_plans').select(`select=*&job_no=eq.${encodeURIComponent(job)}&limit=1`);
  if(ex&&ex[0]){load(ex[0]);msg(`${job} 기존 제작계획을 불러왔습니다. (row_no ${ex[0].row_no})`);return}
  const so=await MESDB.table('sale_orders').select(`select=*&job_no=eq.${encodeURIComponent(job)}&limit=1`);
  if(!so||!so[0]){msg(`${job} 수주정보가 없습니다. 수주등록을 먼저 진행하세요.`);return}
  const s=so[0];
  clearForm(true);setSel('job_no',job);
  setSel('item_name',s.item_name);setSel('product_name',s.product_name);setSel('customer_name',s.customer_name);
  setSel('model',s.model);setSel('order_date',s.order_date);setSel('s1_planned_date',s.s1_planned_date);
  setSel('delivery_planned_date',s.delivery_planned_date);setSel('mold_type_name',s.mold_type_name);
  setSel('process_set_qty',s.process_set_qty);setSel('order_price',s.order_price);
  recalc();msg(`${job} 수주정보를 불러왔습니다. (신규 제작계획)`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120))}
}

async function save(){
 const o=collect();
 if(!o.job_no){msg('제번은 필수입니다.');return}
 if(!online()){msg(`${o.job_no} 저장했습니다. (DB 미연결 - 로컬)`);return}
 try{
  const jb=await MESDB.table('jobs').select(`select=job_no&job_no=eq.${encodeURIComponent(o.job_no)}&limit=1`);
  if(!jb||!jb[0]){msg(`${o.job_no} 은(는) 등록된 제번이 아닙니다. 수주등록을 먼저 진행하세요.`);return}
  const ex=await MESDB.table('sales_plans').select(`select=row_no&job_no=eq.${encodeURIComponent(o.job_no)}&limit=1`);
  /* v39: 기존은 row_no 로 갱신, 신규는 DB identity 에 맡긴다 */
  if(ex&&ex[0]){o.row_no=Number(ex[0].row_no);await MESDB.table('sales_plans').upsert(o,'row_no')}
  else{delete o.row_no;const ins=await MESDB.table('sales_plans').insertOne(o);if(ins&&ins.row_no!=null)o.row_no=Number(ins.row_no)}
  /* 영업계획현황 행 동기화 — v62: 현황행은 job_no 로 찾아 갱신 (sales_plans.row_no 를 그대로 쓰면 다른 제번 행을 덮어씀) */
  let srNo=null;
  try{const sr=await MESDB.table('sales_plan_status_rows').select(`select=row_no&job_no=eq.${encodeURIComponent(o.job_no)}&limit=1`);if(sr&&sr[0])srNo=Number(sr[0].row_no)}catch(e){}
  const sum=(...ks)=>{const v=ks.reduce((a,k)=>a+Number(o[k]||0),0);return v||null};
  const r={job_no:o.job_no,item_name:o.item_name,
   order_price:o.order_price,target_price:o.target_price,profit_rate_pct:o.profit_rate_pct,
   design_start_date:o.design_start_date,design_end_date:o.design_end_date,
   design_days:o.design_days,design_manager:o.design_manager,
   machining_amount:sum('machining_internal_amount','machining_external_amount'),
   assembly_amount:sum('assembly_internal_amount','assembly_external_amount'),
   etc_amount:sum('design_internal_amount','design_external_amount','raw_material_amount','purchase_amount'),
   delivery_planned_date:o.delivery_planned_date};
  try{if(srNo!=null)await MESDB.table('sales_plan_status_rows').upsert({row_no:srNo,...r},'row_no');
      else await MESDB.table('sales_plan_status_rows').insertOne(r)}
  catch(e){msg(`${o.job_no} 계획은 저장됐으나 제작계획현황 반영 실패: `+String(e.message||e).slice(0,100));return}
  /* v68: 설계=외주 + 외주업체 지정이면 외주설계 발주(order_lines)를 여기서 바로 만든다.
     설계관리의 외주설계발주등록 화면을 대신한다. 견적가 = 설계 사외 금액, 입고예정일 = 설계 종료일 */
  let odMsg='';
  try{odMsg=await syncDesignOrder(o)}catch(e){odMsg=' / 외주설계 발주 반영 실패: '+String(e.message||e).slice(0,80)}
  try{MESDB.notify&&MESDB.notify(['sales_plans','sales_plan_status_rows','order_lines'])}catch(e){}
  msg(`${o.job_no} 제작계획을 저장했습니다. (목표원가 ${Number(o.target_price||0).toLocaleString()}원 / 이익률 ${o.profit_rate_pct ?? '-'}%)`+odMsg);
 }catch(e){
  const m=String(e.message||e);
  msg(/무결성|foreign key/i.test(m)?'저장 실패: 등록되지 않은 제번입니다.':'저장 실패: '+m.slice(0,120));
 }
}
/* 외주설계 발주 동기화 — 미입고(status=발주) 라인만 만들거나 고친다. 입고가 시작된 라인은 건드리지 않는다 */
async function syncDesignOrder(o){
 const job=o.job_no;
 const ex=await MESDB.table('order_lines').select(`select=line_id,vendor_name,status,quote_price,nego_rate,receipt_amount&category=eq.외주설계&job_no=eq.${encodeURIComponent(job)}&order=line_id`);
 /* 외주설계는 nego_rate 를 진척률(%)로 쓴다 — 진척이 시작된 라인은 손대지 않는다 */
 const open=(ex||[]).filter(r=>r.status==='발주'&&!(Number(r.nego_rate)>0)&&!(Number(r.receipt_amount)>0));
 const started=(ex||[]).filter(r=>!open.includes(r));
 if(!o.design_outsourced||!o.design_vendor){
  if(open.length)return ` / 주의: 사내설계로 바뀌었지만 외주설계 발주 ${open.length}건(${[...new Set(open.map(r=>r.vendor_name))].join(',')})이 남아 있습니다. 외주설계발주입고에서 발주취소 하세요.`;
  return '';
 }
 if(started.length&&!open.length)return ` / 외주설계 발주는 이미 입고 진행 중(${started[0].vendor_name})이라 변경하지 않았습니다.`;
 const owner=(function(){try{return (window.MES_AUTH||window.parent.MES_AUTH)?.name||null}catch(e){return null}})();
 const quote=Number(o.design_external_amount)||0;
 let proc='A',procName='1/1';
 try{const st=await MESDB.table('design_plan_steps').select(`select=process_code,process_name&job_no=eq.${encodeURIComponent(job)}&order=row_no&limit=1`);
  if(st&&st[0]){proc=st[0].process_code||proc;procName=st[0].process_name||procName}}catch(e){}
 const row={category:'외주설계',status:'발주',job_no:job,item_name:o.item_name||null,
  vendor_name:o.design_vendor,process_code:proc,process_name:procName,
  order_date:new Date().toISOString().slice(0,10),required_date:o.design_end_date||o.design_tryout_date||null,
  quote_price:quote,confirm_price:quote,order_qty:1,owner_name:owner,updated_at:new Date().toISOString()};
 if(open.length){
  const t=open[0];
  await MESDB.table('order_lines').upsert({line_id:t.line_id,vendor_name:row.vendor_name,process_code:proc,process_name:procName,
   required_date:row.required_date,quote_price:quote,confirm_price:quote,updated_at:row.updated_at},'line_id');
  for(const d of open.slice(1))try{await MESDB.table('order_lines').delete({line_id:d.line_id})}catch(e){}
  return ` / 외주설계 발주 갱신: ${row.vendor_name} ${quote.toLocaleString()}원`;
 }
 if(MESDB.ensureRefs)await MESDB.ensureRefs([row]);
 await MESDB.table('order_lines').upsert([row]);
 return ` / 외주설계 발주 생성: ${row.vendor_name} ${quote.toLocaleString()}원 (외주설계발주입고에서 진척 처리)`;
}
window.MES={save,clearForm,setMessage:t=>message.textContent=t,search:loadJob,load,loadJob};
job_no.addEventListener('change',()=>loadJob());
clearForm(true);
</script><script src="mes_sample.js?v=68"></script><script src="mes_demo.js?v=68"></script><script src="mes_db.js?v=68"></script>
